<style>
:root{
  --navy:#0E2033;--navy2:#193A5B;--gold:#D7A93F;--goldl:#F0D99A;--cream:#F8F5EF;
  --card:#fff;--ink:#1B2A3A;--muted:#7c8794;--line:#e8e2d5;
  --ok:#2e9e5b;--bad:#d64545;
  --sky:#3DA5D9;--grass:#35B37E;--grape:#8B5CF6;--peach:#FF8A5B;--sun:#FFC53D;
  --tabh:76px;
  /* رموز الحالات: منقولةٌ من css/app.css:6-7 لأن كتلة STAGE-COPY تستعملها (‎.lsw .rl-tip‎
     تبني حدّها بـvar(--st4)) — والمرجع غير المعرَّف يجعل التصريح Invalid At Computed-Value
     Time فيسقط الحدّ بأسره في مسرح الطالب وحده. */
  --st0:#2e9e5b; --st1:#d64545; --st2:#e8a23d; --st3:#7a8ca3;
  --st4:#58a6d8; --st5:#8e6fc9; --st6:#b3541e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
  font-family:'Tajawal',system-ui,sans-serif;font-size:18px;line-height:1.75}
button,input{font-family:inherit}
button{cursor:pointer}

/* ── الشريط العلوي ── */
.bar{background:var(--navy);color:var(--goldl);padding:11px 14px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:16px;
  position:sticky;top:0;z-index:20}
.bar .who{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.bar .who b{font-size:16px;color:#fff;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who small{color:#9FB0C4;font-weight:500;font-size:12.5px}
.bar .out{background:#1E3A57;color:#F0D99A;border:0;border-radius:12px;padding:11px 14px;
  font-weight:800;font-size:14px;flex:none;min-height:44px}   /* هدف لمس لا يقل عن 44px */
.wrap{max-width:560px;margin:0 auto;padding:14px 13px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 20px)}
.wrap.nobar{padding-bottom:34px}

/* ── البطاقات ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 15px;
  box-shadow:0 4px 18px rgba(27,42,58,.07);margin-bottom:14px}
h1{font-size:24px;font-weight:900;color:var(--navy);margin:0 0 4px;line-height:1.4}
h2{font-size:19px;font-weight:800;color:var(--navy);margin:0 0 10px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.mid{text-align:center}
.big{font-size:52px;line-height:1.15;margin-bottom:4px}

/* ── الدخول ── */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:7px;border-radius:99px;background:#E8E2D5}
.steps i.on{background:var(--gold)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.pick.three{grid-template-columns:repeat(3,1fr)}
/* الشريحة هدفُ لمسٍ لطفلٍ في السابعة: كبيرةٌ تملأ يده، لا زرٌّ صغير يتحرّاه بإصبعه. */
.pk{background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:18px 8px;
  color:var(--ink);font-weight:800;font-size:21px;line-height:1.35;min-height:116px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 2px 10px rgba(27,42,58,.05);transition:border-color .15s,box-shadow .15s}
.pk .em{font-size:38px;line-height:1}
.pk:hover{border-color:var(--goldl);box-shadow:0 6px 18px rgba(27,42,58,.10)}
.pk.on{border-color:var(--gold);background:#FDF8EC}
.pk:active{transform:scale(.97)}
.nid{width:100%;border:2.5px dashed var(--gold);border-radius:18px;padding:16px 12px;
  font-size:27px;font-weight:800;background:#FDF8EC;color:var(--navy);text-align:center;
  letter-spacing:3px;font-variant-numeric:tabular-nums}
.nid:focus{outline:none;border-style:solid}
.nid.code{letter-spacing:12px;font-size:32px}
.go{display:block;width:100%;background:var(--navy);color:var(--goldl);border:0;border-radius:17px;
  padding:16px;font-weight:900;font-size:19px;margin-top:14px}
.go[disabled]{opacity:.4}
.go.gold{background:linear-gradient(135deg,var(--gold),#c2942e);color:var(--navy)}
.go.soft{background:#EFE9DC;color:#6B5B33}
.go.small{padding:12px;font-size:16px;border-radius:14px}
.back{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;padding:8px 2px;margin-top:6px}
.msg{border-radius:14px;padding:12px 13px;margin-top:13px;font-size:15px;font-weight:700;text-align:center;line-height:1.7}
.msg.bad{background:#FBE9E9;color:#a52f2f;border:1.5px solid #f0c2c2}
.msg.wait{background:#FFF3E0;color:#8A5A00;border:1.5px solid #E8A23D}
.msg.ok{background:#E8F6EE;color:#1e7a45;border:1.5px solid #a9dcc0}
.note{background:#FDF8EC;border:1.5px solid var(--gold);border-radius:14px;padding:12px 13px;
  margin-top:14px;font-size:14.5px;line-height:1.8;text-align:center}
.note b{color:var(--navy)}

/* ── بطاقتي ── */
.hero{background:linear-gradient(150deg,#16324f,#0E2033);color:#fff;border:0;text-align:center;
  padding:20px 15px 18px}
.hero .av{width:74px;height:74px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--gold),#b8862b);
  display:flex;align-items:center;justify-content:center;font-size:36px}
.hero h1{color:#fff;font-size:23px;margin:0}
.hero .cn{color:#B9C8D8;font-size:15px;font-weight:600}
.hero .pts{margin-top:12px;background:rgba(255,255,255,.1);border-radius:16px;padding:10px}
.hero .pts b{display:block;font-size:38px;line-height:1.1;color:var(--goldl);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hero .pts span{font-size:14px;color:#C9D6E4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center}
.tile .v{font-size:27px;font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.tile .l{font-size:13.5px;color:var(--muted);font-weight:600}
.ring{width:120px;height:120px;margin:2px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring b{background:#fff;width:94px;height:94px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:29px;line-height:1;color:var(--navy);font-weight:900}
.ring b i{font-size:12.5px;font-style:normal;color:var(--muted);font-weight:600;margin-top:4px}
.streak{background:linear-gradient(135deg,#FFF1D6,#FFE3B0);border:1.5px solid var(--sun);
  border-radius:18px;padding:14px;text-align:center;font-weight:800;font-size:18px;color:#7a5200}
.streak .n{font-size:30px;font-weight:900;color:#B26A00}
.rankbox{background:linear-gradient(135deg,#EEF6FF,#DCEBFA);border:1.5px solid #A9CDEB;
  border-radius:18px;padding:15px;text-align:center}
.rankbox .r{font-size:25px;font-weight:900;color:#17527D;line-height:1.4}
.rankbox small{color:#43708F;font-size:13.5px;font-weight:600;display:block;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.bdg{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:9px 11px;
  font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.bdg .e{font-size:20px}
.bdg.off{opacity:.4}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:14px 6px;line-height:1.8}
.today{background:linear-gradient(135deg,#E9F8F0,#D6F0E4);border:1.5px solid #8ED2B0;border-radius:18px;
  padding:14px;font-weight:800;font-size:16.5px;color:#14603C;text-align:center}

/* ── شريط التبويبات ── */
.tabs{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -3px 16px rgba(27,42,58,.08)}
.tabs button{position:relative;flex:1;background:none;border:0;padding:11px 2px 8px;display:flex;
  flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:700;font-size:12.5px;
  min-height:var(--tabh)}
.tabs button .ic{font-size:25px;line-height:1.15}
.tabs button.on{color:var(--navy)}
.tabs button.on .ic{transform:scale(1.12)}
.tabs button.on::before{content:"";position:absolute;top:0;right:50%;transform:translateX(50%);
  width:36px;height:4px;border-radius:0 0 99px 99px;background:var(--gold)}

/* ── نافذة سفلية ── */
.mask{position:fixed;inset:0;background:rgba(14,32,51,.55);z-index:40;display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{text-align:center}
.toastbox{position:fixed;right:50%;transform:translateX(50%);z-index:50;max-width:90vw;text-align:center;
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);background:var(--navy);color:#fff;
  font-weight:800;font-size:16px;padding:12px 18px;border-radius:99px;box-shadow:0 6px 22px rgba(14,32,51,.3);
  animation:up .2s ease-out}
.demo{background:#EEF1F5;color:#5a6672;text-align:center;font-size:12.5px;font-weight:700;padding:6px 10px}
.load{text-align:center;padding:48px 16px;color:var(--muted);font-size:16px}
.spin{width:38px;height:38px;border:4px solid #E8E2D5;border-top-color:var(--gold);border-radius:50%;
  margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:359px){ html,body{font-size:17px} .pk{font-size:17px;min-height:76px} }

/* ══════════════════════════════════════════════════════════════════════════════
   محتوى التبويبات (موادي · مهامي · دروسي · شهادتي · التدرّب) — زميل المحتوى
   أُضيفت تحت أصناف النواة ولا تُعيد تعريف أيٍّ منها. ولا لون أحمر في أيّ منها.
   ══════════════════════════════════════════════════════════════════════════════ */
.hd{display:flex;align-items:center;gap:9px;margin:2px 0 12px}
.hd .e{font-size:30px;line-height:1}
.hd h1{margin:0;font-size:22px}
.hd p{margin:0;font-size:13.5px;color:var(--muted);font-weight:600}

/* بطاقة مادة */
.sj{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;
  box-shadow:0 4px 18px rgba(27,42,58,.07);margin-bottom:13px}
.sj .top{display:flex;align-items:center;gap:11px;padding:13px 14px;color:#fff}
.sj .top .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:25px}
.sj .top b{display:block;font-size:19px;font-weight:900;line-height:1.35}
.sj .top small{display:block;font-size:13px;opacity:.93;font-weight:600}
.sj .bd{padding:12px 13px 14px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:#F8F5EF;border-radius:14px;padding:9px 4px;text-align:center}
.mini .v{font-size:21px;font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mini .l{font-size:11.5px;color:var(--muted);font-weight:700}
.gline{margin-top:11px}
.gline .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:800;color:var(--navy)}
.gline .t i{font-style:normal;font-weight:900}
.gbar{height:13px;border-radius:99px;background:#EDE7DA;margin-top:6px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px}
.gnote{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.7}
.good{background:#EFF9F3;border:1.5px solid #A9DCC0;border-radius:15px;padding:10px 12px;margin-top:11px;
  font-size:14.5px;line-height:1.75;color:#1e6b42;font-weight:700}
.good small{display:block;color:#4f8f6c;font-weight:600;font-size:12px;margin-top:2px}

/* مهامي */
.tk{background:var(--card);border:1px solid var(--line);border-right:7px solid var(--sky);border-radius:18px;
  padding:13px;margin-bottom:11px;box-shadow:0 3px 14px rgba(27,42,58,.06)}
.tk.done{border-right-color:var(--grass)}
.tk.late{border-right-color:var(--sun)}
.tk b{display:block;font-size:17.5px;font-weight:900;color:var(--navy);line-height:1.45}
.tk .m{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.tk .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
.pill{border-radius:99px;padding:5px 11px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.pill.b{background:#E7F1FB;color:#1B5C8C}
.pill.g{background:#E8F6EE;color:#1e7a45}
.pill.y{background:#FFF3E0;color:#8A5A00}
.pill.p{background:#F1EBFD;color:#5B3BAF}
.tk .go{margin-top:10px}

/* دروسي */
.wkbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.wkbar::-webkit-scrollbar{display:none}
.wkbar button{flex:none;background:#fff;border:2px solid var(--line);border-radius:99px;padding:8px 15px;
  font-weight:800;font-size:15px;color:var(--ink)}
.wkbar button.on{border-color:var(--gold);background:#FDF8EC;color:var(--navy)}
.lsn{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:11px;overflow:hidden}
.lsn .h{display:flex;align-items:center;gap:10px;padding:12px 13px;width:100%;background:none;border:0;text-align:right}
.lsn .h .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:21px;color:#fff}
.lsn .h b{display:block;font-size:16.5px;font-weight:900;color:var(--navy);line-height:1.45}
.lsn .h small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.lsn .h .ar{margin-inline-start:auto;color:var(--muted);font-size:19px;flex:none}
.lsn .bd{padding:0 13px 13px;border-top:1px dashed var(--line)}
.lsn .bd .go{margin-top:9px}
.att{display:flex;align-items:center;gap:8px;background:#F8F5EF;border-radius:14px;padding:9px 11px;margin-top:8px;
  font-size:14.5px;font-weight:700;color:var(--navy);text-decoration:none}
.att .e{font-size:20px}
.att small{color:var(--muted);font-weight:600;font-size:12px;margin-inline-start:auto}
.yt{position:relative;display:block;border-radius:14px;overflow:hidden;margin-top:9px;background:#000;aspect-ratio:16/9}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.86}
.yt i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-style:normal}

/* تقدّمي */
/* ﴿إصلاح﴾ العمود شبكة من ثلاثة صفوف: الرقم (auto) ثم مساحة العمود (1fr) ثم الوصف (auto).
   نسبة ارتفاع ‎.bar‎ تُحسب من صفّها هو — أي من المساحة الباقية بعد النصّين — فلا تنكمش
   الأعمدة العالية إلى سقف واحد. قبل هذا كان ‎.bar‎ عنصراً مرناً في عمود ارتفاعه 132px،
   فأي قيمة تتجاوز ~58% تُرسم بالارتفاع نفسه (490 و322 كلاهما 76px) فيكذب الرسم على الطفل. */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:11px;height:150px;padding:6px 2px 0}
.chart .col{flex:1;max-width:62px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  justify-items:center;align-items:end;height:100%}
.chart .val{font-size:13.5px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.chart .bar{width:100%;align-self:end;border-radius:12px 12px 4px 4px;
  background:linear-gradient(180deg,#F0D99A,var(--gold));min-height:6px}
.chart .col.now .bar{background:linear-gradient(180deg,#8FD8B4,var(--grass))}
.chart .lb{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px;white-space:nowrap}
.trend{background:#FDF8EC;border:1.5px solid var(--goldl);border-radius:15px;padding:11px 12px;margin-top:10px;
  font-size:15px;font-weight:800;color:#7a5200;text-align:center;line-height:1.7}

/* شهادتي */
.cert{background:#fffdf7;border:3px double var(--gold);border-radius:18px;padding:20px 15px;text-align:center;
  box-shadow:0 6px 22px rgba(27,42,58,.1)}
.cert .seal{font-size:56px;line-height:1}
.cert .sch{font-size:13.5px;color:#8a7434;font-weight:800}
.cert .ttl{font-size:26px;font-weight:900;color:var(--navy);margin:6px 0 2px}
.cert .who{font-size:27px;font-weight:900;color:#8a6a1c;margin:12px 0 4px;line-height:1.45}
.cert .ln{font-size:15px;color:var(--ink);line-height:1.95}
.cert .stars{font-size:27px;color:var(--gold);letter-spacing:5px;margin-top:8px}
.cert .ft{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  font-weight:700;margin-top:16px;border-top:1px dashed var(--goldl);padding-top:9px}
.cert .kv{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:10px}
/* ═══ شاشة وليّ الأمر: تقريرٌ كامل على أرضية فاتحة (لا شاشة ألعاب داكنة) ═══ */
.ovg.par{background:var(--cream);color:var(--ink)}
.ovg.par .tp{background:var(--navy);color:#fff}
.ovg.par .in{max-width:620px;padding:12px 12px 40px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px;
  box-shadow:0 1px 6px rgba(14,32,51,.05)}
.pcard.nopad{padding:0;overflow:hidden}
.pcard.nb{border:0;background:transparent;box-shadow:none;padding:0}
.pcard.mid2{text-align:center;color:var(--muted);font-weight:700;font-size:14px;padding:18px 13px}
.pcard.mid2.ok2{color:#1c6b3a;background:#EAF7EF;border-color:#b5e0c4}
.phead{text-align:center;background:linear-gradient(160deg,#fff,#FDF8EC);border-color:var(--goldl)}
.phead .nm{font-size:21px;font-weight:900;color:var(--navy);line-height:1.4}
.phead .sb{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px}
.phead .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.phead .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 4px}
.phead .kpi .v{font-size:20px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.phead .kpi .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.lvb{display:inline-block;margin-top:10px;padding:5px 15px;border-radius:99px;color:#fff;font-weight:900;font-size:13.5px}
.lvb.sm{margin:0;padding:3px 9px;font-size:11.5px}
.lvb.lv0{background:#2e9e5b}.lvb.lv1{background:#2F86C9}.lvb.lv2{background:#B8862B}
.lvb.lv3{background:#E07B3E}.lvb.lv4{background:#C06C2E}
.psec{display:flex;align-items:center;gap:7px;font-weight:900;color:var(--navy);font-size:15px;margin:16px 3px 8px}
.psec i{font-style:normal;font-size:11px;color:var(--grass);font-weight:800;background:#EAF7EF;
  border-radius:99px;padding:2px 8px;margin-inline-start:auto}
/* حصص اليوم */
.ptl{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.pl{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-inline-start:5px solid #cfd6de;border-radius:14px;padding:10px}
.pl.y{border-inline-start-color:var(--grass)}.pl.w{border-inline-start-color:#E0A33E}
.pl.x{border-inline-start-color:var(--bad)}.pl.n{border-inline-start-color:#cfd6de}
.pl.live{box-shadow:0 0 0 2px rgba(215,169,63,.5);background:#FFFDF6}
.pl .pp{flex:none;width:38px;text-align:center;font-weight:900;font-size:17px;color:var(--navy);line-height:1.1}
.pl .pp i{display:block;font-style:normal;font-size:10px;color:var(--muted);font-weight:700;direction:ltr}
.pl .pm{flex:1;min-width:0}
.pl .pm b{display:block;font-size:14.5px;font-weight:900;color:var(--navy)}
.pl .pm small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.pl .pv{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:52%}
.tg{font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;background:#eef1f4;color:#4a5560}
.tg.y{background:#EAF7EF;color:#1c6b3a}.tg.w{background:#FDF6E3;color:#7a5200}
.tg.x{background:#FDECEC;color:#9c2b2b}.tg.n{background:#eef1f4;color:#6b7580}
.sumline{display:flex;flex-wrap:wrap;gap:9px;font-size:13px;font-weight:800;color:var(--navy);justify-content:center}
.sumline .bad{color:var(--bad)}
/* تنبيهات */
.alerts{display:flex;flex-direction:column;gap:8px}
.alerts .al{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;border-radius:12px;padding:9px 11px}
.alerts .al span{font-size:17px}
.alerts .al.bad{background:#FDECEC;color:#9c2b2b}
.alerts .al.warn{background:#FDF6E3;color:#7a5200}
.alerts .al.info{background:#EDF4FB;color:#245b8c}
/* جدول المواد */
.ptbl{overflow-x:auto}
.ptbl table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:430px}
.ptbl th{background:var(--navy);color:#fff;font-weight:800;padding:8px 6px;font-size:11.5px;white-space:nowrap}
.ptbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;font-weight:700;
  font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* خلية الاسم نصٌّ عربي فتعود إلى اتجاهها — الاتجاه يُورَّث من td أعلاه */
.ptbl td.nm{text-align:right;font-weight:900;color:var(--navy);direction:rtl}
.ptbl td.nm small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.ptbl td .bad{color:var(--bad)}
.ptbl tr:last-child td{border-bottom:0}
/* أعمدة الأسابيع */
.pbars{display:flex;align-items:flex-end;gap:10px;height:130px;padding:4px 2px 0}
.pbars .pb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.pbars .pb i{width:100%;max-width:46px;border-radius:8px 8px 0 0;min-height:5px}
.pbars .pb b{font-size:12.5px;font-weight:900;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pbars .pb small{font-size:10px;color:var(--muted);font-weight:700;text-align:center;line-height:1.3}
.pnote{font-size:11.5px;color:var(--muted);font-weight:700;text-align:center;margin-top:8px}
/* زوج «رقم + وحدته» وحدةٌ واحدة لا ينكسر بينهما السطر: «3» ثم «أسئلة» على سطرين خطأ */
.nb{white-space:nowrap}

/* خطوات تفعيل التنبيهات على الآيفون */
.nsteps{margin:0;padding-inline-start:20px;font-size:14px;line-height:2.05;color:var(--ink);font-weight:700}
.nsteps li{margin-bottom:2px}

/* بطاقة «الحصة الآن» في شاشة وليّ الأمر */
.lbc{background:linear-gradient(160deg,#fff,#FDF8EC);border-color:var(--goldl)}
.lbnow{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--navy);font-size:14px;
  background:#FFF3F1;border:1px solid #f3c9bf;border-radius:12px;padding:8px 11px;margin-bottom:10px}
/* flex:none وnowrap: العلامة عنصرٌ مرن بلا أساس، فكانت تُسحق دون عرض «الحصة 3»
   وتنكسر سطرين على كل جوال 360 — والنصّ الذي قبلها عقدةٌ نصّية تأخذ حقّها أولاً. */
.lbnow span{margin-inline-start:auto;font-size:11.5px;color:#9c4b33;font-weight:800;flex:none;white-space:nowrap}
.lbme{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.lbme>div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 4px;text-align:center}
.lbme b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.lbme small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.lbrows{display:flex;flex-direction:column;gap:6px}
.lbr{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 10px}
.lbr.me{background:#FDF6E3;border-color:var(--gold)}
.lbr span{font-size:16px;flex:none}
.lbr b{flex:1;font-size:13.5px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr i{font-style:normal;font-weight:900;color:#7a5200;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
/* سطر «نقاطك اليوم» في لوحة المسرح */
.lsb-me{background:rgba(215,169,63,.18);border:1px solid var(--gold);border-radius:11px;padding:7px 9px;
  font-size:12px;font-weight:800;color:#F0D99A;text-align:center;line-height:1.7;margin-top:4px}
.lsb-me b{color:#fff}

/* ═══ شاشة الدخول: زر الجولة وسطرُ تعريف، وسعةٌ أوسع على الشاشات الكبيرة ═══ */
.tour{display:block;width:100%;margin-top:14px;background:linear-gradient(135deg,#12283F,#0A1725);
  color:var(--goldl);border:1.5px solid rgba(240,217,154,.45);border-radius:16px;padding:13px;
  font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}
.tour:active{transform:scale(.985)}
.lgf{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.8;text-align:center}

/* ── ما ستجده بعد الدخول ──
   الشاشةُ كانت بطاقةً صغيرة في وسط فراغٍ واسع، والطفلُ ووليُّه لا يعرفان ما وراء الباب.
   فصارت الشاشةُ عمودين على الحاسب: الاختيار يميناً والمزايا يساراً، وعموداً واحداً على
   الجوال (الاختيارُ أولاً لأنه العمل، والمزايا تحته لمن يقرأ). وكلُّ بندٍ هنا مأخوذٌ من
   جردٍ موثّقٍ بالشيفرة — لا وعدَ بما لا يعمل. */
.lgrid{display:grid;gap:14px}
.perks{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px 15px 18px;box-shadow:0 4px 18px rgba(27,42,58,.07)}
.perks h2{font-size:17px;margin:0 0 3px}
.perks .psub{color:var(--muted);font-size:13px;font-weight:700;margin:0 0 13px;line-height:1.7}
.pgrp{margin-top:15px}
.pgrp:first-of-type{margin-top:0}
.pgrp>b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:900;color:var(--navy);
  margin-bottom:9px;padding-bottom:7px;border-bottom:1.5px dashed var(--line)}
.pgrp>b i{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);margin-inline-start:auto}
.prow{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}
.prow:last-child{margin-bottom:0}
.prow .pe{font-size:20px;line-height:1.25;flex:none;width:26px;text-align:center}
.prow .pt{min-width:0}
.prow .pt b{display:block;font-size:13.5px;font-weight:900;color:var(--ink);line-height:1.55}
.prow .pt span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.75}
.pnote{font-size:12px;color:var(--muted);font-weight:700;line-height:1.75;text-align:center;
  margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line)}
@media(min-width:760px){
  /* الشاشة الكبيرة: بطاقةٌ واحدة في الوسط وشرائح الصفوف ثلاثةً في السطر — لا عمودان
     ضائعان في منتصف شاشةٍ عريضة كما كانت. */
  .wrap{max-width:640px}
  .pick{grid-template-columns:repeat(3,1fr)}
  .pick.three{grid-template-columns:repeat(3,1fr)}
  .card.mid .big{font-size:64px}
  .pk{min-height:132px;font-size:23px}
  .pk .em{font-size:44px}
}
@media(min-width:980px){
  /* شاشةُ الدخول وحدها تتّسع لعمودين: الفراغُ الذي كان تحت البطاقة صار مكاناً يقرأ فيه
     وليُّ الأمر ما سيجده. وبقيةُ الشاشات تبقى 640 كما هي. */
  .wrap.lgw{max-width:1000px}
  .lgrid.two{grid-template-columns:1.04fr .96fr;align-items:start}
  .perks{padding:20px 19px 22px}
  .perks h2{font-size:19px}
  .prow .pt b{font-size:14px}
  .prow .pt span{font-size:13px}
}

/* ═══ 🎬 مسرح الدرس: هيكل حصة المعلم نفسه (محطات · مسرح · لوحة شرف) ═══ */
.ovg.lsg{padding:0}
.ovg.lsg .tp .bt{margin-inline-start:auto}
.lsw{display:grid;grid-template-columns:232px 1fr;gap:11px;max-width:1180px;margin:0 auto;
  padding:11px 11px 26px;align-items:start}
.ovg.lsg.noboard .lsw{grid-template-columns:1fr}
.ovg.lsg.noboard .lsb{display:none}
.lsc{min-width:0;display:flex;flex-direction:column;gap:9px}
.lst{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.lst::-webkit-scrollbar{display:none}
.lst button{flex:none;background:rgba(255,255,255,.08);border:1.5px solid rgba(240,217,154,.28);
  color:#EAF1F8;border-radius:12px;padding:9px 13px;font-weight:800;font-size:13.5px;white-space:nowrap}
.lst button.on{background:var(--gold);border-color:var(--gold);color:#0E2033}
.lsm{min-height:62vh;display:flex;flex-direction:column}
/* مسرحُ القصة: مساحة أسفل النص لأزرار التنقّل (الشريط مطلقٌ في أسفل المسرح) */
.lsm .story{min-height:58vh;padding-bottom:112px}
.lsm .story-text{font-size:min(4.6vw,30px);margin-top:20px}
.lsm .story-ctrl .go{width:auto;min-width:104px;margin:0;padding:10px 16px;font-size:14.5px;border-radius:13px}
.lsm .live-stage{flex:1;min-height:62vh;display:flex;flex-direction:column}
.lse{background:rgba(255,255,255,.06);border:1.5px dashed rgba(240,217,154,.3);border-radius:16px;
  padding:26px 16px;text-align:center;color:#C7D5E4;font-weight:700;font-size:14.5px}
/* لوحة الشرف */
.lsb{background:rgba(255,255,255,.07);border:1.5px solid rgba(240,217,154,.3);border-radius:16px;padding:11px;position:sticky;top:64px}
.lsb-h{font-weight:900;color:var(--goldl);font-size:14.5px;text-align:center;margin-bottom:9px}
.lsb-r{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border-radius:11px;
  padding:7px 9px;margin-bottom:6px;font-size:13px;font-weight:800;color:#EAF1F8}
.lsb-r.me{background:rgba(215,169,63,.22);border:1px solid var(--gold)}
.lsb-r .m{font-size:16px;flex:none}
.lsb-r .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsb-r .p{color:var(--goldl);font-variant-numeric:tabular-nums;flex:none;direction:ltr;unicode-bidi:isolate}
.lsb-f{font-size:10.5px;color:#9FB0C4;text-align:center;font-weight:700;line-height:1.6;margin-top:4px}
.lsb-e{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:26px;color:var(--goldl);padding:8px 4px}
.lsb-e span{font-size:11.5px;color:#9FB0C4;font-weight:700;text-align:center;line-height:1.6}
/* أسئلة «تحقّق من فهمي» */
.lsq{display:flex;flex-direction:column;gap:7px}
.lsq-b{width:100%;text-align:right;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);
  color:#EAF1F8;border-radius:12px;padding:11px 13px;font-weight:700;font-size:15px;line-height:1.6}
.lsq-b.ok{background:rgba(46,158,91,.28);border-color:#2e9e5b}
.lsq-b.no{background:rgba(214,69,69,.25);border-color:#d64545}
.lsq-b[disabled]{cursor:default}
.lsq-fb{margin-top:8px;font-weight:800;font-size:13.5px;min-height:1px}
.lsq-fb.ok{color:#7BE0A8}.lsq-fb.no{color:#FFB4B4}
/* المقطع */
.lsyt{flex:1;background:#000;border-radius:0 0 14px 14px;overflow:hidden}
.lsyt iframe{width:100%;height:100%;min-height:58vh;border:0;display:block}
@media(max-width:820px){
  .lsw{grid-template-columns:1fr}
  /* اللوحة **فوق** المسرح شريطاً أفقياً واحداً: تحت درسٍ طويل لا يراها أحد، وفوقه كتلةً
     تدفع الدرس خارج الشاشة — فصارت سطراً يُمرَّر بالإصبع (🔴 اليوم ثم 🏆 الفصل). */
  .lsb{position:static;order:0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;
    align-items:center;padding:8px;scrollbar-width:none}
  .lsb::-webkit-scrollbar{display:none}
  .lsc{order:1}
  .lsb .lsb-h{flex:none;margin:0;font-size:13px;white-space:nowrap}
  .lsb .lsb-r{flex:none;min-width:138px;margin:0}
  .lsb .lsb-me{flex:none;margin:0;white-space:nowrap;padding:7px 11px}
  .lsb .lsb-f{display:none}
  .lsb .lsb-e{flex-direction:row;gap:8px;font-size:20px;padding:2px 6px}
}
/* ==STAGE-COPY-START== مُولَّدة من css/app.css بـscratchpad/gen_stage_css.py — لا تُحرَّر يدوياً == */
.lsw .live-stage{flex:1; background:#0a1420; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-height:0}
.lsw .live-stage iframe{flex:1; width:100%; border:0; background:#fff}
.lsw .stage-bar{background:rgba(255,255,255,.08); padding:8px 10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.lsw .stage-bar input{flex:1; min-width:140px; padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; font-family:inherit; font-size:14px}
.lsw .story{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; position:relative; overflow:hidden; padding:24px 24px 16px; text-align:center; background:radial-gradient(900px 500px at 50% 0%,#1d3a5f,#0a1420)}
.lsw .story-visual{font-size:min(30vw,190px); line-height:1; filter:drop-shadow(0 8px 20px rgba(0,0,0,.4)); display:flex; align-items:center; justify-content:center; flex:0 1 auto; min-height:0; overflow:hidden; margin-top:auto}
.lsw .story-img{max-height:min(48vh,360px); max-width:92%; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.5); object-fit:contain; background:#fff}
.lsw .story-visual{animation:stpop .55s ease}
.lsw .story-text{font-size:min(5.2vw,36px); font-weight:800; color:#eaf1f8; margin:26px 0 auto; max-width:860px; line-height:1.85; animation:stfade .5s ease; max-height:38vh; overflow-y:auto; overscroll-behavior:contain; flex:0 1 auto; min-height:0}
.lsw .story-player{position:static; width:100%; flex:none; margin-top:14px; display:flex; flex-direction:column; gap:10px; align-items:center}
.lsw .story-seek{width:min(680px,92%); height:12px; background:rgba(255,255,255,.18); border-radius:8px; cursor:pointer; overflow:hidden}
.lsw .story-seek-fill{height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--goldl)); border-radius:8px; transition:width .2s linear}
.lsw .story-ctrl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center}
.lsw .story-time{color:#c9d5e3; font-size:13px; font-variant-numeric:tabular-nums; min-width:92px; text-align:center; direction:ltr; unicode-bidi:isolate}
.lsw .story-rate{background:rgba(255,255,255,.12); color:#eaf1f8; border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:7px 11px; font-family:inherit; font-size:13px; font-weight:800; cursor:pointer; white-space:nowrap}
.lsw .story-rate:hover{background:rgba(255,255,255,.2)}
.lsw .rl-scroll{flex:1; overflow-y:auto; background:#0a1420; border-radius:0 0 14px 14px}
.lsw .rl-wrap{max-width:860px; margin:0 auto; padding:22px 20px 40px; color:#eaf1f8}

  /* ═══ عدّاد المحاولات: ثلاث ⇒ 30 ثانية، ثم ثلاث دقائق (محلياً في المتصفح) ═══
     ﴿حدّ معلوم ومقصود﴾ ردعُ واجهة لا حاجزٌ أمني: يُتجاوز بمسح تخزين المتصفح أو بنافذة تصفّح
     خفية، ولا خنق له على الخادم. وظيفته أن يردع زميلاً يجرّب أرقاماً بأصابعه أمام الشاشة.
     أما الحاجز الحقيقي فغيره: list ممنوع على spins فلا تُسرد البصمات، والبصمة لا تُعكس، ورقم
     الهوية لا يُخزَّن في أي مستند، وApp Check يحجب كل طلبٍ من خارج النطاق المعتمد. */
  function lockGet() { try { return JSON.parse(lsGet(LKEY) || "{}") || {}; } catch (e) { return {}; } }
  function lockLeft() { const l = lockGet(); return Math.max(0, (+l.u || 0) - Date.now()); }
  function lockFail() {
    const l = lockGet(); l.n = (+l.n || 0) + 1;
    if (l.n % 3 === 0) l.u = Date.now() + (l.n === 3 ? 30000 : 180000);
    lsSet(LKEY, JSON.stringify(l)); return l;
  }
  const lockClear = () => lsDel(LKEY);
  const mmss = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + pad2(s % 60); };

  /* ═══ شاشات الدخول ═══ */
  let pickG = 0, pickC = "";
  /* aside: لوحةٌ اختيارية بجانب بطاقة الدخول (المزايا في الخطوة الأولى). بلا aside تبقى
     الشبكةُ عموداً واحداً فلا يتغيّر شيءٌ في الخطوتين الثانية والثالثة. */
  /* لوحة «ما ستجده بعد الدخول». كلُّ بندٍ هنا تحقّقنا من عمله في الشيفرة قبل كتابته،
     ولم يُذكر ما لا يعمل اليوم: «يصلك إشعارٌ والتطبيق مغلق» يحتاج أسراراً غير مضبوطة
     في المستودع، فلا يُوعَد به وليُّ أمرٍ حتى تُضبط. والمذكور هنا يعمل بلا إعدادٍ زائد. */
  const PERK_KID = [
    ["🪪", "نقاطك وحضورك أمامك", "مجموع نقاطك، ونسبة حضورك، وسلسلة أيامك، وشاراتك التي جمعتها"],
    ["✏️", "تحلّ ورقة معلمك وتعرف درجتك في الحال", "تُصحَّح فور تسليمها، وتراجع أخطاءك، وتصل درجتك معلمك"],
    ["🎒", "الدرس كما يعرضه معلمك في الحصة", "القصة والمصطلحات و«تحقّق من فهمي» والألعاب — وتُفتح بعدها بلا إنترنت"],
    ["🏅", "شهادة باسمك تحفظها أو تطبعها", "أرقامها من رصد معلميك، وترسلها لأهلك بضغطة"],
  ];
  const PERK_PAR = [
    ["👨‍👩‍👦", "حصص اليوم حصةً حصة", "حاضر أو غائب، وكم شارك، وهل حلّ الواجب، وأي ملاحظة سلوك — والمعلم لا يزال في الحصة"],
    ["🔔", "«ما يحتاج متابعتكم» في سطور", "غيابُ اليوم، وواجبٌ لم يُحلّ، وورقةٌ فات موعدها، ومادةٌ نزل مستواه فيها"],
    ["📚", "مستواه في كل مادة على حدة", "درجته ونسبته وتقديره وحضوره ومشاركاته عند كل معلم"],
    ["📬", "رسائل معلميه تصل صندوقه وحده", "استدعاءٌ أو شكرٌ أو تقريرُ مستوى — لا يقرؤها زملاؤه"],
  ];
  const perkRows = (a) => a.map(([e, t, d]) =>
    `<div class="prow"><div class="pe">${e}</div><div class="pt"><b>${t}</b><span>${d}</span></div></div>`).join("");
  const PERKS = `<div class="perks">
    <h2>ما ستجده بعد الدخول 🌱</h2>
    <p class="psub">بوابةٌ لك ولأهلك معاً — كلُّ ما فيها من دفتر معلميك، لا شيء مُدخَلٌ باليد.</p>
    <div class="pgrp"><b>🧒 لك أنت<i>٦ تبويبات</i></b>${perkRows(PERK_KID)}</div>
    <div class="pgrp"><b>👨‍👩‍👦 لأمك أو أبيك<i>شاشةٌ كاملة</i></b>${perkRows(PERK_PAR)}</div>
    <div class="pnote">🔒 لا يفتح بوابتك إلا أنت — وتقدر تقفلها برمزٍ سرّي من عندك.</div>
  </div>`;
  function shell(step, inner, aside) {
    $("#bar-t").textContent = "بوابتي";
    $("#bar-s").textContent = (META.school && META.school.name) || "سجلي";
    $("#bar-out").hidden = true; $("#tabs").hidden = true;
    app.className = "wrap nobar" + (aside ? " lgw" : "");
    app.innerHTML = `<div class="lgrid${aside ? " two" : ""}">
      <div class="card">
        <div class="steps">${[1, 2, 3].map(i => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
        ${inner}</div>
      ${aside || ""}</div>`;
  }
  function loginGrade() {
    pickG = 0; pickC = "";
    const gs = [...new Set(D.classes.map(c => +c.gc || 0))].filter(Boolean).sort((a, b) => a - b);
    shell(1, `<h1>أهلاً بك 👋</h1><p class="sub">في أي صف أنت؟</p>
      <div class="pick" id="gg">${gs.map(g => `<button class="pk" data-g="${g}"><span class="em">${GEM[g] || "📘"}</span>${esc(GS[g] || g)}</button>`).join("")}</div>
      <button class="tour" id="tour">🎬 شاهد الجولة</button>
      <div class="lgf">اختر صفك ثم فصلك، وادخل برقم هويتك — ولا تحتاج كلمة مرور</div>`, PERKS);
    app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { pickG = +b.dataset.g; loginSec(); });
    // الجولة بالطلب: إعادة الصفحة بـ?intro=1 (المفتاح نفسه الذي يستعمله زر التطبيق)
    const tb = $("#tour");
    if (tb) tb.onclick = () => {
      const ps = location.search.replace(/^\?/, "").split("&").filter(x => x && !/^intro=/.test(x));
      ps.push("intro=1");
      location.href = location.pathname + "?" + ps.join("&");
    };
  }
  function loginSec() {
    const list = D.classes.filter(c => +c.gc === pickG);
    shell(2, `<h1>الصف ${esc(GNAME[pickG] || pickG)} ${GEM[pickG] || ""}</h1><p class="sub">وأي فصل؟</p>
      <div class="pick ${list.length > 2 ? "three" : ""}" id="cc">${list.map(c => `<button class="pk" data-c="${esc(c.id)}"><span class="em">🚪</span>${esc(secOf(c))}</button>`).join("")}</div>
      <button class="back" id="bk">← رجوع</button>`);
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { pickC = b.dataset.c; loginNid(); });
    $("#bk").onclick = loginGrade;
  }
  function loginNid() {
    const c = clsById(pickC) || {};
    const hint = CLOUD ? "" : `<div class="note">🧪 <b>الوضع التجريبي</b> — اضغط الزر ليُملأ رقم جاهز.<br><button class="go soft small" id="fill" style="margin-top:8px">✨ املأ رقماً تجريبياً</button></div>`;
    shell(3, `<h1>${esc(GS[pickG] || "")} ${esc(secOf(c))} 🚪</h1><p class="sub">اكتب رقم هويتك (١٠ أرقام)</p>
      <input class="nid" id="nid" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="••••••••••">
      <button class="go gold" id="in">دخول ←</button>
      <div id="err"></div>${hint}
      <button class="back" id="bk">← رجوع</button>`);
    const inp = $("#nid");
    $("#bk").onclick = loginSec;
    const f = $("#fill");
    if (f) f.onclick = () => { const i = (c.students || []).findIndex(s => !s.moved && !s.gap); inp.value = demoNid(c, i < 0 ? 0 : i); };
    inp.oninput = () => { const v = arNum(inp.value); if (v !== inp.value) inp.value = v; };
    inp.onkeydown = (e) => { if (e.key === "Enter") $("#in").click(); };
    setTimeout(() => { try { inp.focus(); } catch (e) { } }, 80);
    $("#in").onclick = () => tryLogin(arNum(inp.value));
    tickLock();
  }
  let lockIv = null;
  function tickLock() {
    if (lockIv) { clearInterval(lockIv); lockIv = null; }
    const btn = $("#in"), err = $("#err");
    if (!btn || !err) return;
    const paint = () => {
      const left = lockLeft();
      if (left <= 0) { btn.disabled = false; if (err.dataset.w) { err.innerHTML = ""; delete err.dataset.w; } if (lockIv) { clearInterval(lockIv); lockIv = null; } return; }
      btn.disabled = true; err.dataset.w = "1";
      err.innerHTML = `<div class="msg wait">استرِح قليلاً ⏳ ثم جرّب مرة أخرى<br><b style="font-size:22px">${mmss(left)}</b></div>`;
    };
    paint(); if (lockLeft() > 0) lockIv = setInterval(paint, 500);
  }
  function loginErr(html) { const e = $("#err"); if (e) e.innerHTML = `<div class="msg bad">${html}</div>`; }

  async function tryLogin(nid) {
    if (lockLeft() > 0) return tickLock();
    if (!/^[0-9]{6,14}$/.test(nid)) return loginErr("اكتب رقم هويتك كاملاً 🙂");
    const btn = $("#in"); if (btn) { btn.disabled = true; btn.textContent = "لحظة…"; }
    let r;
    try { r = await lookup(pickC, nid); }
    catch (e) { if (btn) { btn.disabled = false; btn.textContent = "دخول ←"; } return loginErr("ما قدرنا نتصل الآن 📡<br>تأكد من الإنترنت وجرّب مرة أخرى."); }
    if (btn) { btn.disabled = false; btn.textContent = "دخول ←"; }
    if (!r) { afterBad("ما لقينا هذا الرقم 🤔<br>تأكد منه، أو اسأل معلمك."); return; }
    if (r.out) { loginErr("يبدو أنك انتقلت من هذه المدرسة 🌱<br>راجع معلمك."); return; }
    if (r.doc.c) { H = r.h; return askCode(r); }
    finish(r, true);
  }
  function afterBad(msg) {
    const l = lockFail();
    loginErr(msg + (l.n % 3 === 2 ? "<br><small>بقيت لك محاولة واحدة قبل الانتظار</small>" : ""));
    tickLock();
  }
  /* البحث: البصمة تُحسب من الفصل الذي يختاره الطفل. فإن لم تُوجد جرّبنا الفصول التي نُقل منها
     طلاب إلى فصله فعلاً (وهي وحدها، لا كل فصول المدرسة) — فيدخل الطالب المنقول قبل أن يُعاد
     استيراد رقمه بالفصل الجديد. */
  async function lookup(cid, nid) {
    const h = await sha256(nid + "|" + cid + "|" + SALT);
    let snap = await fdoc("spins/" + h), used = h;
    if (!snap.exists) {
      const froms = [...new Set((D.moves || []).filter(m => m.to === cid && m.appliedSi != null).map(m => m.from))];
      for (const f of froms) {
        const h2 = await sha256(nid + "|" + f + "|" + SALT);
        const s2 = await fdoc("spins/" + h2);
        if (s2.exists) { snap = s2; used = h2; break; }
      }
    }
    if (!snap.exists) return null;
    const doc = snap.data() || {};
    const pos = resolvePos(String(doc.cid || ""), +doc.si);
    if (pos.out) return { out: true };
    const c = clsById(pos.cid), st = c && (c.students || [])[pos.si];
    if (!c || !st || st.gap || st.moved) return { out: true };
    return { h: used, doc, cid: pos.cid, si: pos.si };
  }
  function askCode(r) {
    shell(3, `<h1>رمزك السري 🔒</h1><p class="sub">اكتب الأرقام الأربعة التي اخترتها</p>
      <input class="nid code" id="code" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••">
      <button class="go gold" id="in">دخول ←</button>
      <div id="err"></div>
      <div class="note">نسيت رمزك؟ 🙂 معلمك يقدر يعيد ضبطه لك.</div>
      <button class="back" id="bk">← رجوع</button>`);
    const inp = $("#code");
    $("#bk").onclick = loginNid;
    inp.oninput = () => { const v = arNum(inp.value); if (v !== inp.value) inp.value = v; };
    inp.onkeydown = (e) => { if (e.key === "Enter") $("#in").click(); };
    setTimeout(() => { try { inp.focus(); } catch (e) { } }, 80);
    $("#in").onclick = async () => {
      if (lockLeft() > 0) return tickLock();
      const v = arNum(inp.value);
      if (v.length !== 4) return loginErr("اكتب أربعة أرقام 🙂");
      const c = await sha256(v + "|" + r.h);
      if (c !== r.doc.c) { inp.value = ""; return afterBad("الرمز غير صحيح 🤔"); }
      finish(r, false);
    };
    tickLock();
  }
  function finish(r, offerCode) {
    lockClear(); H = r.h; ssSet(HKEY, r.h);
    HASCODE = !!(r.doc || {}).c;
    /* mk مفتاح صندوق رسائله: يأتي داخل بصمة هويته ولا يُعرف بغيرها، ويُحفظ مع الجلسة على جهازه
       لأن الجلسة المستأنفة لا تعيد قراءة البصمة. من لا مفتاح له = مدرسة سجّلت هوياتها قبل الميزة. */
    const sess = { cid: r.cid, si: r.si, ts: Date.now(), mk: String((r.doc || {}).mk || ""), h: r.h, hc: HASCODE };
    lsSet(SKEY, JSON.stringify(sess));
    enter(sess, offerCode && !r.doc.c);
  }
  function restore() {
    let s = null; try { s = JSON.parse(lsGet(SKEY) || "null"); } catch (e) { }
    if (!s || !s.cid || !(s.si >= 0)) return null;
    s.mk = String(s.mk || "");
    if (!(+s.ts > 0) || Date.now() - s.ts > SMAX) { lsDel(SKEY); return null; }
    const pos = resolvePos(s.cid, s.si);
    if (pos.out) { lsDel(SKEY); return null; }
    const c = clsById(pos.cid), st = c && (c.students || [])[pos.si];
    if (!c || !st || st.gap || st.moved) { lsDel(SKEY); return null; }
    // البصمة من الجلسة أولاً ثم من sessionStorage (لجلسةٍ حُفظت قبل هذا الإصلاح)
    H = (typeof s.h === "string" && s.h) ? s.h : ssGet(HKEY);
    HASCODE = !!s.hc;
    // mk يعود مع الجلسة: enter تكتب الجلسة من جديد، فإسقاطه هنا يكتب "" فوق المفتاح
    //   ويُفقد الطالب صندوق رسائله وإشعاراته إلى الأبد بعد أول إعادة تحميل.
    return { cid: pos.cid, si: pos.si, ts: s.ts, mk: s.mk, h: H || "", hc: HASCODE };
  }

  /* ═══ البوابة ═══ */
  function enter(sess, offerCode) {
    const c = clsById(sess.cid), st = (c.students || [])[sess.si] || {};
    S = {
      cid: sess.cid, si: sess.si, name: String(st.n || "طالب"), first: String(st.n || "طالب").split(" ")[0],
      cname: c.name || "", gc: +c.gc || 0, gname: GNAME[+c.gc] || "", sec: secOf(c),
      mk: String(sess.mk || ""),
      parent: (PH && PH[sess.cid + ":" + sess.si]) || ""      // جوال ولي أمره هو وحده
    };
    stashNames(sess.cid);          // اسمان لكل زميل في فصله (لوحة الشرف) قبل نسيان الأسماء
    PH = null; forgetNames();      // بقية المدرسة تُنسى هنا: لا اسم زميل ولا جوال ولي أمره
    lsSet(SKEY, JSON.stringify({ cid: S.cid, si: S.si, ts: Date.now(), mk: S.mk, h: H || String(sess.h || ""), hc: HASCODE || !!sess.hc }));
    $("#bar-t").textContent = S.first;
    $("#bar-s").textContent = S.cname;
    $("#bar-out").hidden = false;
    $("#bar-out").onclick = askOut;
    app.className = "wrap";
    paintTabs(); showTab(CURTAB);
    // زملاء المحتوى ينتظرون الجلسة (شارة الرسائل والاستماع الحيّ) — الحدث بعد أول رسم
    try { window.dispatchEvent(new CustomEvent("sijil:student-in")); } catch (e) { }
    if (offerCode) setTimeout(codeSheet, 700);
  }
  const TABS = [
    { id: "card", ic: "🪪", t: "بطاقتي" }, { id: "msg", ic: "📬", t: "رسائلي" },
    { id: "task", ic: "✏️", t: "مهامي" }, { id: "subj", ic: "📚", t: "موادي" },
    { id: "less", ic: "🎒", t: "دروسي" }, { id: "cert", ic: "🏅", t: "شهادتي" }
  ];
  /* شارات التبويبات: عددُ ما لم يُفتح بعد (رسالة جديدة أو ورقة لم تُحلّ). يضبطها زميل المحتوى
     بـST.tabCount، فيرى الطفل أن عنده جديداً قبل أن يفتح التبويب. */
  const TABN = {};
  const REG = {};       // تبويبات يسجّلها زملاء المحتوى: REG[id] = {render(el)}
  /* ﴿إضافة زميل المحتوى﴾ شريحة ثالثة في «بطاقتي» تحت الشارات: التقدّم أسبوعاً بأسبوع وزر «لوالديّ».
     أُضيفت بلا مساس بما قبلها — الشريحة الفارغة لا تطبع شيئاً، والنواة تعمل كما كانت بدونها. */
  let BADGES = null, TODAY = null, EXTRA = null;
  function paintTabs() {
    const tb = $("#tabs"); tb.hidden = false;
    tb.innerHTML = TABS.map(t => `<button data-t="${t.id}" class="${t.id === CURTAB ? "on" : ""}"><span class="ic">${t.ic}</span>${esc(t.t)}${TABN[t.id] ? `<i class="tn">${TABN[t.id] > 9 ? "9+" : TABN[t.id]}</i>` : ""}</button>`).join("");
    tb.querySelectorAll("[data-t]").forEach(b => b.onclick = () => showTab(b.dataset.t));
  }
  function showTab(id) {
    CURTAB = id;
    $("#tabs").querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === id));
    try { window.scrollTo(0, 0); } catch (e) { }
    app.innerHTML = `<div class="load"><div class="spin"></div>لحظة…</div>`;
    const def = REG[id];
    if (id === "card" && !def) return cardTab(app);
    if (def && typeof def.render === "function") {
      try { def.render(app, API); } catch (e) { app.innerHTML = soon(TABS.find(t => t.id === id)); }
      return;
    }
    app.innerHTML = soon(TABS.find(t => t.id === id));
  }
  const soon = (t) => `<div class="card mid"><div class="big">${t ? t.ic : "🌱"}</div>
    <h1>${esc(t ? t.t : "")}</h1><p class="sub" style="margin:0">نجهّز لك هذا القسم… عد إليه قريباً 🌱</p></div>`;

  function askOut() {
    sheet(`<h2>تخرج من بوابتك؟ 🚪</h2>
      <button class="go gold" id="so">نعم، خروج</button>
      <button class="go soft" id="sc" style="margin-top:9px">لا، أبقى</button>`, (box, close) => {
      box.querySelector("#so").onclick = () => { lsDel(SKEY); ssDel(HKEY); H = null; S = null; RECS = null; GRADES = null; close(); location.reload(); };
      box.querySelector("#sc").onclick = close;
    });
  }
  function sheet(html, onopen) {
    const m = document.createElement("div"); m.className = "mask";
    m.innerHTML = `<div class="sheet">${html}</div>`;
    const close = () => { try { document.body.removeChild(m); } catch (e) { } };
    m.onclick = (e) => { if (e.target === m) close(); };
    document.body.appendChild(m);
    if (onopen) onopen(m.querySelector(".sheet"), close);
    return close;
  }

  /* ═══ الرمز الاختياري: الكتابة الوحيدة في هذه الصفحة كلها ═══ */
  function codeSheet() {
    /* رمزٌ مضبوطٌ من قبل: القاعدة تسمح بكتابة c مرةً واحدة أبداً، فلا تُعرض عليه خانةٌ
       تُرفض كتابتها ثم تُقال له «ما قدرنا نحفظه 📡». يُقال له الحقُّ ومن يُغيّره له. */
    if (HASCODE) {
      return sheet(`<h2>رمزك مضبوط ✅</h2>
        <p class="sub mid">بوابتك مقفلةٌ برمزك، ويُطلب منك كلما دخلت برقم هويتك.
        <br><br>ولتغييره راجع معلمك أو إدارة المدرسة — لا يُغيَّر من هنا حمايةً لك.</p>

  function toast(msg) {

  /* ═══ الحساب: النقاط والحضور والسلسلة والرتبة (منقولة عن منطق js/app.js) ═══ */
  const emptyRec = (e) => !e || (e.a == null && !e.part && e.hw == null && !e.sh && !((e.beh || []).length) && !String(e.note || "").trim());
  function calcOne(cd, si) {
    const out = { pts: 0, days: 0, st: STATES.map(() => 0), part: 0, hwY: 0, hwN: 0, sh: 0, behP: 0, behN: 0, notes: [] };
    for (const date of Object.keys(cd || {})) {
      const e = (cd[date] || {})[si]; if (emptyRec(e)) continue;
      out.days++;
      if (e.a != null && STATES[e.a]) { out.st[e.a]++; out.pts += (+STATES[e.a].pts || 0); }
      if (e.part) { out.part += e.part; out.pts += e.part * (+W.part || 0); }
      if (e.hw === 1) { out.hwY++; out.pts += (+W.hw || 0); }
      if (e.hw === 0) out.hwN++;
      if (e.sh) { out.sh += e.sh; out.pts += e.sh * (+W.sheets || 0); }
      (e.beh || []).forEach(bi => { const b = BEH[bi]; if (!b) return; out.pts += (+b.pts || 0); if ((+b.pts || 0) >= 0) out.behP++; else out.behN++; });
      if (e.note) out.notes.push({ date, note: e.note });

    out.pts = Math.round(out.pts * 10) / 10;
    return out;
  }
  function calcAll(si) {
    const tot = { pts: 0, days: 0, st: STATES.map(() => 0), part: 0, hwY: 0, hwN: 0, sh: 0, behP: 0, behN: 0, notes: [] };
    Object.keys(RECS || {}).forEach(tid => {
      const t = calcOne(RECS[tid], si);
      tot.pts += t.pts; tot.days += t.days; tot.part += t.part; tot.hwY += t.hwY; tot.hwN += t.hwN;
      tot.sh += t.sh; tot.behP += t.behP; tot.behN += t.behN;
      t.st.forEach((v, k) => tot.st[k] += v);
      tot.notes = tot.notes.concat(t.notes);
    });
    tot.pts = Math.round(tot.pts * 10) / 10;
    return tot;
  }
  const stCnt = (t, f) => STATES.reduce((a, s, k) => a + (f(s.name || "") ? (t.st[k] || 0) : 0), 0);
  function attPct(t) {
    const tot = t.st.reduce((x, y) => x + y, 0); if (!tot) return null;
    const denom = tot - stCnt(t, isExc); if (denom <= 0) return null;
    const attended = stCnt(t, n => /حاضر|عن بعد/.test(n)) + 0.5 * stCnt(t, n => /متأخر/.test(n));
    return Math.round(Math.min(1, attended / denom) * 100);
  }
  /* سلسلة الحضور: أيام المدرسة الأخيرة يوماً يوماً.
     ﴿إصلاح﴾ الوحدة يومٌ لا حصة: الطفل «جاء اليوم» إن رُصد حاضراً في حصة واحدة على الأقل،
     ولو غفل معلم من عشرة عن تعديل حالته. وكان أي غيابٍ في أي حصة يكسر السلسلة، فقُيست
     على رابع/أ فكان متوسطها 0.76 يوم و13 طالباً من 21 على صفر ولا أحد يبلغ العشرة —
     أي أن الميزة التي تُعيد الطفل غداً كانت لا تعمل. الآن: اليوم يكسرها فقط إن غاب في كل
     ما رُصد له فيه (غياب حقيقي عن المدرسة)، والمأذون لا يكسر، واليوم بلا حالة لا يُحسب. */
  function streak(si) {
    const dates = new Set();
    Object.keys(RECS || {}).forEach(tid => Object.keys(RECS[tid] || {}).forEach(d => dates.add(d)));

    let n = 0;
    for (const d of sorted) {

      Object.keys(RECS).forEach(tid => {
        const e = ((RECS[tid] || {})[d] || {})[si];

        const nm = STATES[e.a].name || "";
        if (isAbs(nm)) absent++; else if (isHere(nm)) here++;

      if (absent > here) break;         // غاب في أكثر ما رُصد له ⇒ يومٌ خارج المدرسة، تنكسر هنا

  // رسالة الرتبة بصيغة النمو دائماً — ولا تُقال إلا لمن يُعرض له رقمه (الثلث الأعلى)
  function rankWord(rk) {
    if (rk.rank <= 3) return "ما شاء الله، أنت من الأوائل 🌟";
    return "مكانك جميل، وتقدر ترتفع أكثر 💪";
  }
  /* ﴿قاعدة الرقم﴾ رقم الرتبة يُعرض للثلث الأعلى وحده. الطفل الأخير في فصله كان يقرأ في

     مقارنات ضارّة… ولا شيء يخيفه». ومن دون الثلث الأعلى يرى رسالة نموّ بلا أي رقم. */
  const rankShows = (rk) => !!rk && rk.rank <= Math.max(3, Math.ceil(rk.of / 3));
  let RANK;                                   // تُحسب مرة واحدة قبل مسح رصد الزملاء من الذاكرة
  /* لوحة الشرف: الخمسة الأوائل بأسمائهم ونقاطهم — تُحسب في اللحظة نفسها التي تُحسب فيها الرتبة
     ثم يُنسى كل ما عداها. لوحةُ الشرف عُرفٌ مدرسيٌّ معلن (تُعلَّق على الحائط)، ولا تكشف مرتبة
     متأخّرٍ أبداً: من ليس فيها لا يُعرف موضعه. ومن لا نقاط له لا يظهر — ولا تُعرض من أقل من

  let BOARD;
  /* لوحة **اليوم** لحظياً: نقاط كل طالب من رصد هذا اليوم وحده — بها يرى ولي الأمر تقدّم ابنه
     في الحصة الجارية مقارنةً بزملائه. تُحسب في كل لقطة قبل forgetPeers، ولا يبقى منها إلا

  let LIVEB = null;
  function dayPtsOf(si, date) {
    let p = 0, any = false;
    Object.keys(RECS || {}).forEach(tid => {
      const e = ((RECS[tid] || {})[date] || {})[si]; if (!e) return;
      any = true;
      if (e.a != null && STATES[e.a]) p += (+STATES[e.a].pts || 0);
      if (e.part) p += e.part * (+W.part || 0);
      if (e.hw === 1) p += (+W.hw || 0);

    });
    return any ? Math.round(p * 10) / 10 : null;
  }
  /* تجميع نقاط اليوم لكل معلم على حدة قبل نسيان الزملاء (LIVEDAY[tid][si] = نقاط اليوم).
     لماذا؟ كل لقطة onSnapshot تحمل مستند معلمٍ واحد، وrecs الزملاء تُمحى بعد كل لقطة —
     فحسابُ اللوحة من RECS مباشرةً كان يعطي نقاط زميلٍ من مستندٍ واحد ونقاطَ ابن وليّ الأمر
     كاملةً، فيقفز إلى المركز الأول كذباً. والمُخزَّن أرقامٌ مجمَّعة لا سجلات. */
  const LIVEDAY = {};
  let LIVEDATE = "";
  const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  function liveAbsorb() {
    const date = todayKey();
    if (LIVEDATE !== date) { Object.keys(LIVEDAY).forEach(k => delete LIVEDAY[k]); LIVEDATE = date; }
    const c = clsById(S.cid); if (!c) return;
    Object.keys(RECS || {}).forEach(tid => {
      const day = ((RECS[tid] || {})[date]) || null;
      if (!day) return;
      const agg = {};
      Object.keys(day).forEach(k => {
        const i = +k, e = day[k];
        if (!(i >= 0) || !e || emptyRec(e)) return;              // سجلٌّ فارغ ليس رصداً
        let p = 0;
        if (e.a != null && STATES[e.a]) p += (+STATES[e.a].pts || 0);
        if (e.part) p += e.part * (+W.part || 0);
        if (e.hw === 1) p += (+W.hw || 0);
        if (e.sh) p += e.sh * (+W.sheets || 0);
        (e.beh || []).forEach(bi => { const b = BEH[bi]; if (b) p += (+b.pts || 0); });
        agg[i] = Math.round(p * 10) / 10;
      });

    });
  }
  function liveBoardCompute() {
    const c = clsById(S.cid); if (!c) return null;
    const sum = {};
    Object.keys(LIVEDAY).forEach(tid => {
      const a = LIVEDAY[tid] || {};
      Object.keys(a).forEach(k => { sum[k] = Math.round(((sum[k] || 0) + a[k]) * 10) / 10; });
    });
    const rows = [];
    (c.students || []).forEach((st, i) => {
      if (!st || st.moved || st.gap) return;
      if (!(String(i) in sum)) return;                           // لم يُرصد له اليوم شيء
      rows.push({ i: i, n: bName(i), pts: sum[String(i)] });
    });
    if (!rows.length) return null;

    rows.forEach((r, k) => {

      if (r.i === S.si) { mine = lastR; mypts = r.pts; }

      board: rows.filter(r => r.pts > 0).slice(0, 5).map(r => ({ n: r.n, pts: r.pts, me: r.i === S.si })),
      mine: mine ? { rank: mine, pts: mypts } : null

  }
  function boardCompute() {
    const c = clsById(S.cid); if (!c) return [];
    const rows = (c.students || []).map((st, i) => ({ i: i, n: bName(i), off: !!(st && (st.moved || st.gap)), pts: calcAll(i).pts }))
      .filter(r => !r.off && r.pts > 0);
    if (rows.length < 3) return [];
    rows.sort((a, b) => b.pts - a.pts);

  }
  function rankCompute(si) {
    const c = clsById(S.cid); if (!c) return null;

      .filter(r => r.active);

    const sorted = rows.slice().sort((a, b) => b.pts - a.pts);

    sorted.forEach((r, k) => { if (lastP === null || r.pts !== lastP) { lastR = k + 1; lastP = r.pts; } if (r.i === si) mine = lastR; });
    if (!mine) return null;
    const rk = { rank: mine, of: rows.length };
    rk.show = rankShows(rk);                  // زملاء المحتوى يحترمون هذا العلم أيضاً
    return rk;
  }
  // الرتبة المحسوبة سلفاً: بعدها لا يبقى في الذاكرة رصدُ زميل تُحسب منه رتبة أصلاً
  function rankOf(si) { return (si === (S && S.si) && RANK !== undefined) ? RANK : rankCompute(si); }

  /* اتجاهي: نقاطي في آخر أيامي المرصودة مقابل ما قبلها — رسالة نموّ بلا رقم لمن لا يُعرض رقمه */
  function myDayPts(date, si) {
    let p = 0;
    Object.keys(RECS || {}).forEach(tid => {
      const e = ((RECS[tid] || {})[date] || {})[si]; if (!e) return;
      if (e.a != null && STATES[e.a]) p += (+STATES[e.a].pts || 0);
      if (e.part) p += e.part * (+W.part || 0);
      if (e.hw === 1) p += (+W.hw || 0);
      if (e.sh) p += e.sh * (+W.sheets || 0);
      (e.beh || []).forEach(bi => { const b = BEH[bi]; if (b) p += (+b.pts || 0); });

  }
  function myTrend(si) {
    const dates = new Set();
    Object.keys(RECS || {}).forEach(tid => Object.keys(RECS[tid] || {}).forEach(d => dates.add(d)));
    const sorted = [...dates].sort();
    if (sorted.length < 4) return 0;

  function myTeachers() {

  }
  /* ═══ «اقرأ ثم انسَ»: لا يبقى في الذاكرة رصدُ زميلٍ ولا درجتُه ولا اسمه ═══
     مستند الرصد recs/{معلم_فصل} يحمل الفصل كله (حالات غياب الزملاء وسلوكهم السالب وملاحظات
     معلميهم)، ودرجات grades كذلك. البوابة تحتاج نقاط الزملاء لمرّة واحدة: لتعرف مكان الطالب

  async function loadRecs() {

    const snaps = await Promise.all(list.map(t => fdoc("recs/" + t.id + "_" + S.cid).catch(() => null)));

  /* ═══ تبويب «بطاقتي» ═══ */
  async function cardTab(el) {

      const b = el.querySelector("#rt"); if (b) b.onclick = () => showTab("card"); return;
    }
    const t = calcAll(S.si), att = attPct(t), stk = streak(S.si), rk = t.pts > 0 ? rankOf(S.si) : null;
    const started = t.days > 0;
    // من ليس في الثلث الأعلى: رسالة نموّ بلا أي رقم — لا رتبته ولا عدد زملائه
    const tr = started ? myTrend(S.si) : 0;
    const growLine = tr > 0 ? "نقاطك ترتفع 📈" : tr < 0 ? "كل يوم فرصة جديدة 🌱" : "أنت ثابت ومستمر 💪";
    const growSub = tr > 0 ? "واصل هكذا — أنت في الطريق الصحيح 🌟"
      : tr < 0 ? "نقطة اليوم ترفعك مكاناً — وأنت تقدر 💪"
        : "كل نقطة ترفعك مكاناً — وأنت تقدر 🌱";
    const cheer = !started ? "بوابتك جاهزة، وأول رصد قريب 🌱"
      : t.pts >= 40 ? "ما شاء الله! أنت في قمة نشاطك 🌟"
        : t.pts >= 10 ? "شغلك حلو، واصل 💪" : "كل يوم خطوة… وأنت تقدر 🌱";
    const ringc = att == null ? "#E8E2D5" : (att >= 90 ? "var(--ok)" : att >= 70 ? "var(--sun)" : "var(--peach)");
    const todayHtml = (typeof TODAY === "function") ? (TODAY(API) || "") : "";
    const bdgs = (typeof BADGES === "function") ? (BADGES(API) || []) : [];
    const extraHtml = (typeof EXTRA === "function") ? (EXTRA(API) || "") : "";

    el.innerHTML = `
      <div class="card hero">
        <div class="av">🧒</div>
        <h1>${esc(S.name)}</h1>
        <div class="cn">${esc(S.cname)}</div>
        <div class="pts"><b>${started ? t.pts : "—"}</b><span>مجموع نقاطك</span></div>
      </div>
      ${todayHtml ? `<div class="card" id="today-slot">${todayHtml}</div>` : `<div id="today-slot" hidden></div>`}
      <div class="card mid">
        <h2>حضورك 🎒</h2>
        <div class="ring" style="background:conic-gradient(${ringc} 0 ${att == null ? 0 : att}%, #EDE7DA ${att == null ? 0 : att}%)">
          <b>${att == null ? "—" : att + "%"}<i>${att == null ? "لا حضور مرصود" : "من حصصك"}</i></b></div>
        <div class="grid2" style="margin-top:6px">
          <div class="tile"><div class="v" style="color:var(--grass)">${t.days}</div><div class="l">حصص رُصدت لك</div></div>
          <div class="tile"><div class="v" style="color:var(--sky)">${t.part}</div><div class="l">مرات مشاركة</div></div>
        </div>
      </div>
      <div class="card"><div class="streak">${stk > 0 ? `<span class="n">${stk}</span> ${stk === 1 ? "يوم" : stk === 2 ? "يومان" : stk <= 10 ? "أيام" : "يوماً"} حضور متصل 🔥` : "ابدأ سلسلتك اليوم 🔥"}</div></div>
      <div class="card">
        <h2>${rk && rk.show ? "مكانك في فصلك 🏅" : "أنت تتقدّم 🌱"}</h2>
        ${rk && rk.show
        ? `<div class="rankbox"><div class="r">أنت ${esc(ord(rk.rank))} من ${rk.of}</div>
            <small>${esc(rankWord(rk))}</small>
            <small>ولا نُظهر أسماء زملائك — هذا سرّك أنت 🤫</small></div>`
        : started
          ? `<div class="rankbox"><div class="r">${esc(growLine)}</div>
            <small>${esc(growSub)}</small>
            <small>ولا نُظهر أسماء زملائك ولا ترتيبهم — هذا سرّك أنت 🤫</small></div>`
          : `<div class="empty">بعد أول رصد يظهر تقدّمك هنا 🌱</div>`}
      </div>
      <div class="card">
        <h2>شاراتي ⭐</h2>
        <div class="badges" id="badges-slot">${bdgs.length
        ? bdgs.map(b => `<span class="bdg ${b.on === false ? "off" : ""}"><span class="e">${esc(b.icon || "⭐")}</span>${esc(b.label || "")}</span>`).join("")
        : `<div class="empty">شاراتك في الطريق إليك 🎁</div>`}</div>
      </div>
      <div id="extra-slot">${extraHtml}</div>
      <div class="card mid"><p class="sub" style="margin:0 0 12px">${esc(cheer)}</p>
        <button class="go soft small" id="mycode">🔒 رمزي السري</button></div>`;
    const mc = el.querySelector("#mycode"); if (mc) mc.onclick = codeSheet;
  }

  /* ═══ واجهة زملاء المحتوى: window.SIJIL_STUDENT ═══ */
  const API = {
    V: 1, CLOUD, SALT,
    get db() { return db; },
    get S() { return S; },
    get D() { return D; },
    get META() { return META; },
    get STATES() { return STATES; }, get BEH() { return BEH; }, get W() { return W; },
    fdoc, fcol, withTimeout, esc, ord, arNum, sha256, applyMoves, resolvePos, clsById, secOf,
    myTeachers, loadRecs, loadGrades, calcOne, calcAll, attPct, streak, rank: rankOf,
    board() { return (BOARD || []).map(x => ({ n: x.n, pts: x.pts, me: x.me })); },
    liveBoard() { return LIVEB ? JSON.parse(JSON.stringify(LIVEB)) : null; },
    staff,
    tab(id, def) { REG[id] = def; if (CURTAB === id && S) showTab(id); },
    /* استماعٌ حيّ لرصد معلمي فصله: المعلم يسجّل مشاركةً أو غياباً في الحصة فيظهر في شاشة
       وليّ الأمر بلا إعادة تحميل — وهو المطلوب «تقييم لحظي أثناء اليوم». ويُنسى رصد الزملاء
       بـforgetPeers كما في loadRecs حرفاً بحرف، فلا يصل الجهازَ رصدُ طالبٍ آخر. */
    watchRecs(cb) {
      if (!CLOUD || !db || !S) return null;
      const list = myTeachers(), subs = [];
      list.forEach(t => {
        try {
          subs.push(db.doc("recs/" + t.id + "_" + S.cid).onSnapshot((d) => {
            RECS = RECS || {};
            RECS[t.id] = (d && d.exists) ? (((d.data() || {}).d) || {}) : {};
            try { forgetPeers(); } catch (e) { }
            try { if (cb) cb(t.id); } catch (e) { }
          }, () => { }));
        } catch (e) { }
      });
      return () => subs.forEach(u => { try { u(); } catch (e) { } });
    },
    // شارة تبويب: العدد فوق الأيقونة (٠ يُزيلها)
    tabCount(id, n) { const v = Math.max(0, +n || 0); if (TABN[id] === v) return; TABN[id] = v; if (S) paintTabs(); },
    /* استماعٌ حيّ لمستند واحد: به تظهر الرسالة الجديدة والورقة الجديدة بلا إعادة تحميل — وهو
       أيضاً إشعار الطفل داخل البوابة. سحابياً فقط (الوضع التجريبي بلا onSnapshot)، ولا يرمي أبداً. */
    sub(path, cb) {
      if (!CLOUD || !db || !path || typeof cb !== "function") return null;
      try { return db.doc(path).onSnapshot((d) => { try { cb(d && d.exists ? (d.data() || {}) : null); } catch (e) { } }, () => { }); }
      catch (e) { return null; }
    },
    badges(fn) { BADGES = fn; if (CURTAB === "card" && S) showTab("card"); },
    today(fn) { TODAY = fn; if (CURTAB === "card" && S) showTab("card"); },
    extra(fn) { EXTRA = fn; if (CURTAB === "card" && S) showTab("card"); },
    go(id) { if (S) showTab(id); },
    refresh() { if (S) showTab(CURTAB); },
    sheet, toast, soon
  };
  window.SIJIL_STUDENT = API;

  boot();
})();
</script>
<script src="../js/student/content.js?v=65"></script>
</body>
