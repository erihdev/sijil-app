# ═══════════════════════════════════════════════════════════════════════════════
# سجلي — تنبيهات الحصص للمعلمين وإشعارات الطلاب
#
# تشغّل هذه المهمة السكربت tools/push_send.py أثناء الدوام فيرسل لكل معلم إشعاراً قبل
# بداية حصته: «الحصة الثالثة بعد ٨ دقائق — رابع (أ) — تبدأ 9:15». يصل والجوال مقفل،
# لأن الإرسال يتم من هنا لا من داخل التطبيق. وtools/push_students.py يُخبر الطالب
# بواجبٍ أو رسالةٍ جديدة.
#
# ── لماذا حلقةٌ داخل المشغّل لا تشغيلةٌ كل خمس دقائق؟ ──
# كانت المهمة cron كل خمس دقائق. وبالقياس (٧–١٣ سبتمبر ٢٠٢٦): GitHub ينفّذ ثلث هذه
# التشغيلات فقط بفجواتٍ بلغت ٤٢ دقيقة، ويوم الأحد ١٣ سبتمبر علقت تشغيلةٌ في الطابور
# ١٢ ساعة و٤٣ دقيقة فحجبت — بمجموعة التزامن — ٤٦ تشغيلةً بعدها: لا تنبيه طوال اليوم.
# فصارت المهمة تشغيلاتٍ قليلةً طويلة: كلٌّ منها تدور داخل المشغّل حتى ساعةٍ ثابتة،
# تُرسل كل خمس دقائق للمعلمين وكل ربع ساعة للطلاب. والمستودع عامّ فدقائق المشغّل مجانية.
# وتُعاد كل ساعة (cancel-in-progress) فإن علقت واحدةٌ في الطابور أخذت التالية مكانها.
#
# قبل أول تشغيل تُضبط أسرار المستودع SA_JSON وVAPID_PRIVATE وVAPID_SUB (docs/PUSH_SETUP.md).
# ما دامت غير مضبوطة تمرّ المهمة بسلام وتكتب سطراً يوضّح ذلك (لا فشل أحمر).
# ═══════════════════════════════════════════════════════════════════════════════

name: تنبيهات الحصص

on:
  schedule:
    # cron في GitHub بالتوقيت العالمي دائماً. الرياض = UTC+3 طوال السنة.
    # أرقام الأيام: 0=الأحد … 4=الخميس — أيام الدوام؛ الجمعة والسبت عطلة.
    # كل سطرٍ مجموعةُ تزامنٍ مستقلة (تُقرأ في concurrency.group أدناه)، ونهايتها ساعةٌ
    # ثابتة يحسبها السكربت من نصّ السطر نفسه:
    #   الصباح الأول: يبدأ 02:55 ويُعاد كل ساعة، ينتهي 06:54 UTC (09:54 بالرياض)
    - cron: "55 2,3,4,5 * * 0-4"
    #   الصباح الثاني: يبدأ 06:55 ويُعاد كل ساعة، ينتهي 10:54 UTC (13:54 بالرياض)
    - cron: "55 6,7,8,9 * * 0-4"
    #   العصر — الطلاب وحدهم (لا حصص): 10:55 → 16:00 UTC (19:00 بالرياض)، كل ربع ساعة.
    #   الواجب أو الرسالة بعد الدوام كانت لا تصل قبل صباح الغد.
    - cron: "55 10,11,12,13,14 * * 0-4"

  # تشغيل يدوي من تبويب Actions — دورةٌ واحدة، للتجربة أو لإرسالٍ فوري
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بلا إرسال (حساب وطباعة فقط)"
        type: boolean
        default: true
      at:
        description: "ساعة افتراضية بتوقيت الرياض بصيغة HH:MM (اختياري — للتجربة)"
        type: string
        default: ""
      day:
        description: "يوم افتراضي مثل: الأحد (اختياري — للتجربة)"
        type: string
        default: ""

# صلاحيات المهمة: قراءة الملفات فقط — لا تكتب شيئاً في المستودع
permissions:
  contents: read

# مجموعةٌ لكل سطر cron: تشغيلات الصباح الأول لا تُزاحم الثاني ولا العصر. وداخل المجموعة
# تُلغي التشغيلةُ الجديدة السابقةَ — عالقةً في الطابور أو دائرة — وتكمل إلى النهاية نفسها.
concurrency:
  group: class-alerts-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

jobs:
  send:
    name: إرسال تنبيهات الحصص
    runs-on: ubuntu-latest
    # أطول حلقة (العصر) ٣٠٥ دقائق؛ والسقف في GitHub ٣٦٠
    timeout-minutes: 330

    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: التحقق من ضبط الأسرار
        id: gate
        env:
          HAS_SA: ${{ secrets.SA_JSON != '' }}
          HAS_KEY: ${{ secrets.VAPID_PRIVATE != '' }}
          HAS_SUB: ${{ secrets.VAPID_SUB != '' }}
        run: |
          if [ "$HAS_SA" = "true" ] && [ "$HAS_KEY" = "true" ] && [ "$HAS_SUB" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "### تنبيهات الحصص غير مفعّلة بعد" >> "$GITHUB_STEP_SUMMARY"
            echo "لم تُضبط أسرار الإرسال في هذا المستودع، فلم يُرسل شيء." >> "$GITHUB_STEP_SUMMARY"
            echo "الخطوات كاملة في docs/PUSH_SETUP.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: تهيئة بايثون
        if: steps.gate.outputs.ready == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        if: steps.gate.outputs.ready == 'yes'
        # إصدارات مثبَّتة عمداً: تُجرَّب قبل رفعها (انظر docs/PUSH_SETUP.md ← تحديث المكتبات)
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "pywebpush==2.5.0" "google-auth==2.57.1" "requests==2.34.2"

      - name: حلقة الإرسال
        if: steps.gate.outputs.ready == 'yes'
        env:
          # الأسرار تُمرَّر كمتغيّرات بيئة فقط، ولا يطبعها السكربت ولا يكتبها في أي ملف
          SA_JSON: ${{ secrets.SA_JSON }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUB: ${{ secrets.VAPID_SUB }}
          # الرابط الذي تفتحه نقرة الإشعار (اتركه فارغاً ليفتح جذر التطبيق)
          SIJIL_URL: ${{ vars.SIJIL_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          # وسائط التشغيل اليدوي — تُبنى هنا لا داخل سطر الأوامر
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          AT: ${{ inputs.at }}
          DAY: ${{ inputs.day }}
        # bash صراحةً ⇒ -eo pipefail: بالصدفة الافتراضية كان رمزُ خروج الأنبوب هو رمز tee
        #   (صفرٌ دائماً)، فانهيارُ السكربت يظهر خطوةً خضراء وتتوقف التنبيهات أياماً بلا أثر.
        shell: bash
        run: |
          # ── نهاية الحلقة وطبيعتها من سطر cron نفسه ──
          case "$SCHEDULE" in
            "55 2,3,4,5 * * 0-4")        END_H="06:54"; TEACHERS=1; STEP=300 ;;
            "55 6,7,8,9 * * 0-4")        END_H="10:54"; TEACHERS=1; STEP=300 ;;
            "55 10,11,12,13,14 * * 0-4") END_H="16:00"; TEACHERS=0; STEP=900 ;;
            *)                           END_H="";      TEACHERS=1; STEP=0   ;;   # يدوي: دورة واحدة
          esac
          # النهايات قبل بداية النافذة التالية بدقيقة: لا تتزامن دورتان فيُرسَل للطالب مرتين
          if [ -n "$END_H" ]; then
            END=$(date -u -d "today ${END_H}" +%s)
          else
            END=$(( $(date -u +%s) + 1 ))
          fi
          T_ARGS=(); S_ARGS=("--max-age" "4320")
          if [ -n "$DRY" ]; then T_ARGS+=("$DRY"); S_ARGS+=("$DRY"); fi
          if [ -n "$AT" ];  then T_ARGS+=("--now" "$AT"); fi
          if [ -n "$DAY" ]; then T_ARGS+=("--day" "$DAY"); fi
          : > run.log; : > students.log
          i=0; ts=0; ss=0; tf=0; sf=0
          while :; do
            NOW=$(date -u +%s)
            if [ -n "$END_H" ] && [ "$NOW" -ge "$END" ]; then
              if [ "$i" -eq 0 ]; then
                echo "بدأت التشغيلة بعد نهاية نافذتها ($(date -u +%H:%M) UTC ≥ ${END_H}) — لا شيء يُرسل." | tee -a run.log
              fi
              break
            fi
            echo "── دورة $((i+1)) · $(date -u +%H:%M) UTC ──" | tee -a run.log
            if [ "$TEACHERS" = "1" ]; then
              if python tools/push_send.py "${T_ARGS[@]}" >> run.log 2>&1; then ts=$((ts+1)); else tf=$((tf+1)); echo "  ✖ push_send خرج برمز غير صفر" | tee -a run.log; fi
            fi
            # الطلاب كل ربع ساعة: القراءة ٣ مستندات لكل مشترك، والتواتر الأعلى يتجاوز حصة الخطة المجانية
            if [ "$TEACHERS" = "0" ] || [ $((i % 3)) -eq 0 ]; then
              echo "── الطلاب · دورة $((i+1)) · $(date -u +%H:%M) UTC ──" >> students.log
              if python tools/push_students.py "${S_ARGS[@]}" >> students.log 2>&1; then ss=$((ss+1)); else sf=$((sf+1)); echo "  ✖ push_students خرج برمز غير صفر" | tee -a students.log; fi
            fi
            i=$((i+1))
            if [ "$STEP" = "0" ]; then break; fi
            # لا ننام إلى ما بعد النهاية
            NOW=$(date -u +%s); LEFT=$(( END - NOW ))
            if [ "$LEFT" -le 0 ]; then break; fi
            sleep $(( LEFT < STEP ? LEFT : STEP ))
          done
          echo "انتهت: $i دورة · المعلمون ناجح $ts فشل $tf · الطلاب ناجح $ss فشل $sf" | tee -a run.log
          {
            echo "### تنبيهات الحصص — $i دورة · المعلمون ناجح $ts / فشل $tf · الطلاب ناجح $ss / فشل $sf"
            echo '```'
            tail -n 120 run.log
            echo '```'
            echo "### إشعارات الطلاب"
            echo '```'
            tail -n 60 students.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # فشلٌ في كل الدورات = المهمة حمراء (لا تُخفى الأعطال خلف حلقةٍ خضراء)
          if [ "$TEACHERS" = "1" ] && [ "$ts" -eq 0 ] && [ "$tf" -gt 0 ]; then exit 1; fi
          if [ "$TEACHERS" = "0" ] && [ "$ss" -eq 0 ] && [ "$sf" -gt 0 ]; then exit 1; fi
