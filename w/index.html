<meta name="description" content="ورقة عمل تفاعلية من معلمك: افتح الرابط من جوالك، اختر اسمك، وحلّ الأسئلة. تُصحَّح آلياً وتصل نتيجتك إلى المعلم.">
<meta property="og:type" content="website"><meta property="og:site_name" content="سجلي">
<meta property="og:title" content="ورقة عمل تفاعلية — سجلي">
<meta property="og:description" content="افتح الرابط من جوالك، اختر اسمك، وحلّ الأسئلة. تُصحَّح آلياً وتصل نتيجتك إلى المعلم فوراً.">

<style>
:root{--navy:#0E2033;--navy2:#142A44;--gold:#D7A93F;--goldl:#F0D99A;--cream:#F8F5EF;
  --card:#fff;--ink:#1B2A3A;--muted:#7c8794;--line:#e8e2d5;--ok:#2e9e5b;--bad:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
  font-family:'Tajawal',system-ui,sans-serif;font-size:17px;line-height:1.7}
.bar{background:var(--navy);color:var(--goldl);padding:12px 16px;display:flex;
  justify-content:space-between;align-items:center;font-weight:800;font-size:15px;
  position:sticky;top:0;z-index:5}
.bar small{color:#9FB0C4;font-weight:500;font-size:12px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;
  box-shadow:0 4px 18px rgba(27,42,58,.06)}
h1{font-size:21px;font-weight:800;color:var(--navy);margin:0 0 4px;line-height:1.35}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.lbl{font-size:13px;color:var(--muted);margin:0 0 8px}
button{font-family:inherit;font-size:16px}
.name{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--line);
  border-radius:13px;padding:13px 15px;margin-bottom:9px;color:var(--ink);font-weight:600}
.name.on{border-color:var(--gold);background:#FDF8EC}
.go{display:block;width:100%;background:var(--navy);color:var(--goldl);border:0;border-radius:14px;
  padding:15px;font-weight:800;margin-top:14px}
.go[disabled]{opacity:.45}
.go.gold{background:var(--gold);color:var(--navy)}
.prog{height:8px;background:#E8E2D5;border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .35s}
.qn{font-size:13px;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.q{font-size:19px;font-weight:800;margin:0 0 16px;line-height:1.6}
.opt{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--line);
  border-radius:13px;padding:14px 15px;margin-bottom:10px;color:var(--ink)}
.opt.on{border-color:var(--gold);background:#FDF8EC;font-weight:700}
.fill{width:100%;border:2px dashed var(--gold);border-radius:13px;padding:14px 15px;
  font-family:inherit;font-size:17px;background:#FDF8EC;color:var(--ink);text-align:center;font-weight:700}
.fill:focus{outline:none;border-style:solid}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;text-align:center}
.nav{display:flex;gap:9px;margin-top:16px}
.nav button{flex:1;border-radius:13px;padding:14px;font-weight:800;border:0}
.back{background:#EFE9DC;color:#6B5B33}
.ring{width:132px;height:132px;margin:6px auto 14px;border-radius:50%;display:flex;
  align-items:center;justify-content:center}
.ring b{background:#fff;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:31px;line-height:1;color:var(--navy)}
.ring b i{font-size:12px;font-style:normal;color:var(--muted);font-weight:500;margin-top:3px}
.rev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:9px;font-size:14px}
.rev .x{color:var(--bad);font-weight:800} .rev .v{color:var(--ok);font-weight:800}
.rev .a{color:var(--ok);font-weight:700}
.mid{text-align:center}
.big{font-size:56px;line-height:1;margin-bottom:6px}
.timer{background:#FDF8EC;border:1.5px solid var(--gold);border-radius:99px;padding:3px 13px;
  font-weight:800;font-size:14px;color:var(--navy);font-variant-numeric:tabular-nums}
.timer.hot{background:#FBE9E9;border-color:var(--bad);color:var(--bad)}
.late{background:#FFF3E0;border:1px solid #E8A23D;color:#8A5A00;border-radius:10px;
  padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.err{text-align:center;padding:40px 16px;color:var(--muted)}
.err b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.note2{background:#FDF8EC;border:1.5px solid var(--gold);border-radius:12px;padding:11px 13px;
  margin-top:14px;font-size:13.5px;line-height:1.75;text-align:center;color:var(--ink)}
.note2 b{color:var(--navy)}
</style>
</head>
<body>
<div class="bar"><span id="bar-t">ورقة عمل</span><small id="bar-s"></small></div>
<div class="wrap" id="app"><div class="err" id="ld">جارِ التحميل…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/fb.js?v=64"></script>
<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const app = $("#app");
  const AID = new URLSearchParams(location.search).get("a") || "";
  const PV = new URLSearchParams(location.search).get("pv") === "1";   // معاينة المعلم: تجربة كاملة بلا تسجيل تسليم ولا احتساب محاولة
  const MODE_T = { ws: "ورقة عمل", quiz: "اختبار", race: "تحدٍّ" };
  let db = null, A = null, C = null, si = -1, sname = "", answers = [], qi = 0, t0 = 0, tIv = null, left = 0;
  let PREV = null;   // تسليم سابق: المحاولة الأولى هي المعتمدة
  /* مفتاح «هذا الجهاز هو صاحب التسليم»: صفحة الطالب بلا حساب ولا كلمة سر (يختار اسمه من
     قائمة الفصل)، فمراجعة الأخطاء — وفيها الإجابة الصحيحة لكل سؤال — لا تُعرض إلا للجهاز
     الذي أرسل ذلك التسليم. بدونه كان اختيار اسم زميل استنفد محاولته يكشف مفتاح الإجابة
     كاملاً لمن لم يحلّ شيئاً. */
  const mineKey = (i) => "sijil.solved." + AID + "." + i;
  const isMine = (i) => { try { return localStorage.getItem(mineKey(i)) === "1"; } catch (e) { return false; } };
  const markMine = (i) => { try { localStorage.setItem(mineKey(i), "1"); } catch (e) { } };
  // عدد المحاولات المسموحة: tries (0 = بلا حد حتى 12)؛ للأوراق القديمة: retry=false → 1، وإلا 12 لورقة العمل و1 للاختبار/السباق
  function allowed() {
    const t = +A.tries;
    if (A.tries !== undefined && A.tries !== null && Number.isFinite(t)) return t === 0 ? 12 : Math.max(1, Math.min(12, t));
    if (A.retry === false || A.mode !== "ws") return 1;
    return 12;
  }
  function triesLabel(used) {
    const n = allowed(), left = Math.max(0, n - (used || 0));
    if (n === 1) return "🔁 محاولة واحدة فقط — راجع إجاباتك قبل الإرسال";
    if (used) return `🔁 المحاولة القادمة رقم ${used + 1} من ${n}${left ? "" : " — استُنفدت المحاولات"}`;
    return `🔁 لديك ${n} محاولات، والدرجة المعتمدة من المحاولة الأولى`;
  }

  const fail = (t, s) => { app.innerHTML = `<div class="err"><b>${esc(t)}</b>${esc(s || "")}</div>`; };
  const TMO = 15000;                 // لا انتظار بلا نهاية: شبكة المدرسة الضعيفة تعلّق الوعد أبداً بلا رسالة
  function withTimeout(p, ms) {
    return new Promise((res, rej) => {
      const t = setTimeout(() => { const e = new Error("timeout"); e.code = "timeout"; rej(e); }, ms || TMO);
      Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
    });
  }
  // حركات نقل الطلاب: نفس اشتقاق التطبيق — المنقول يبقى في مصفوفته معلَّماً moved، والقادم يوضع عند الفهرس newSi المسجَّل في الحركة (لا بالدفع)
  // لأن بياناته رُحِّلت إليه؛ الفجوات تُملأ بعناصر شاغرة، والموضع المحجوز بطالب فعلي ⇒ تُهمل الحركة، والمكررة (نفس from,si) تُهمل وتستهلك موضعها.
  // هنا لا يُحمَّل إلا فصل الورقة، فإن غاب الفصل المصدر يُركَّب الطالب من اسم الحركة (synth).
  const isGap = (s) => !!(s && s.gap);
  function applyMoves(classes, moves, synth) {
    const byId = {}; (classes || []).forEach(c => { c.students = c.students || []; byId[c.id] = c; });
    const gapItem = () => ({ n: "", p: "", gap: true, moved: { to: "gap", ts: 0 } });
    const slotOf = (m, dst) => (Number.isInteger(m.newSi) && m.newSi >= 0 && m.newSi < 400) ? m.newSi : dst.students.length;
    const reserve = (dst, nsi) => { while (dst.students.length <= nsi) dst.students.push(gapItem()); return dst.students[nsi]; };
    const done = new Set();
    let pending = (moves || []).slice().sort((a, b) => ((a.ts || 0) - (b.ts || 0)) || String(a.id || "").localeCompare(String(b.id || "")));
    for (let pass = 0; pending.length && pass < 8; pass++) {
      const later = [];
      pending.forEach(m => {
        const key = m.from + ":" + m.si, src = byId[m.from], dst = m.to === "out" ? null : (byId[m.to] || null);
        const s = src ? src.students[m.si] : (synth ? { n: m.name || "", p: "" } : null);
        if (!s || isGap(s)) { later.push(m); return; }
        if (done.has(key) || s.moved) { if (dst) reserve(dst, slotOf(m, dst)); return; }
        if (dst) {
          const nsi = slotOf(m, dst), occ = reserve(dst, nsi);
          if (!isGap(occ)) { m.conflict = true; try { console.warn("[moves] تعارض: الموضع " + m.to + "[" + nsi + "] محجوز — أُهملت الحركة " + (m.id || "")); } catch (e) { } return; }
          const copy = Object.assign({}, s); delete copy.moved; delete copy.gap; copy.from = { cid: m.from, si: m.si, ts: m.ts };
          dst.students[nsi] = copy; m.appliedSi = nsi;
        }
        if (src) s.moved = { to: m.to, ts: m.ts };
        done.add(key);
      });
      if (later.length === pending.length) break;
      pending = later;
    }
    pending.forEach(m => { const dst = m.to !== "out" && byId[m.to]; if (dst) reserve(dst, slotOf(m, dst)); });
  }
  // تطبيع إجابة «أكمل الفراغ»: تشكيل، ألف/ياء/تاء، «الـ»، مسافات
  const norm = (s) => String(s || "").trim().replace(/[ً-ْـ]/g, "")
    .replace(/[إأآا]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
    .replace(/^ال/, "").replace(/\s+/g, " ").toLowerCase();

  /* رمز App Check لا يكون جاهزاً لحظة activate: أول قراءة قد تُرفض بـ permission-denied
     رغم صحة القواعد (رأيناها فعلياً على بوابة الطالب: أول تحميل يفشل والثاني ينجح).
     ننتظر الرمز أولاً، ونعيد المحاولة مرة واحدة بعد مهلة قصيرة إن رُفضت. */
  async function acReady() {
    try { if (firebase.appCheck) await Promise.race([firebase.appCheck().getToken(), new Promise(r => setTimeout(r, 6000))]); } catch (e) { }
  }
  async function withAC(fn) {
    try { return await fn(); }
    catch (e) {
      if (!e || e.code !== "permission-denied") throw e;
      await acReady(); await new Promise(r => setTimeout(r, 700));
      return await fn();
    }
  }
  async function boot() {
    if (!AID || !/^[a-z0-9]{4,12}$/.test(AID)) return fail("رابط غير مكتمل", "اطلب من معلمك إرسال الرابط كاملاً.");
    const slow = setTimeout(() => { const el = $("#ld"); if (el) el.textContent = "الاتصال يستغرق وقتاً أطول من المعتاد…"; }, 5000);
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      try { if (firebase.appCheck && window.APPCHECK_SITE_KEY) firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(window.APPCHECK_SITE_KEY), true); } catch (e) { }
      await acReady();
      await withTimeout(firebase.auth().signInAnonymously());
      db = (window.sijilSpaceDb ? window.sijilSpaceDb(firebase.firestore()) : firebase.firestore());   // مساحة المدرسة
      const s = await withTimeout(db.doc("assign/" + AID).get());
      if (!s.exists) { clearTimeout(slow); return fail("الورقة غير موجودة", "تأكد من الرابط، أو اسأل معلمك."); }
      A = s.data();
      if (!A || !Array.isArray(A.qs) || !A.qs.length || !A.cid) { clearTimeout(slow); return fail("الورقة غير مكتملة", "اطلب من معلمك إعادة إرسالها."); }
      const c = await withTimeout(db.doc("classes/" + A.cid).get());
      C = c.exists ? c.data() : { students: [] }; C.id = A.cid; C.students = C.students || [];
      // حركات النقل: بدونها تُعرض قائمة قديمة (المنقول يختار اسمه القديم ويُسلِّم بفهرسه القديم) — لذا محاولتان ثم رسالة فشل صريحة لا متابعة صامتة
      let mvOK = false;
      for (let tryN = 0; tryN < 2 && !mvOK; tryN++) {
        try {
          const [toS, fromS] = await withTimeout(Promise.all([db.collection("moves").where("to", "==", A.cid).get(), db.collection("moves").where("from", "==", A.cid).get()]));
          const mv = {}; toS.forEach(d => mv[d.id] = Object.assign({ id: d.id }, d.data())); fromS.forEach(d => mv[d.id] = Object.assign({ id: d.id }, d.data()));
          applyMoves([C], Object.values(mv), true); mvOK = true;
        } catch (e) { }
      }
      clearTimeout(slow);
      if (!mvOK) return fail("تعذّر تحميل قائمة الفصل", "لم تصل حركات نقل الطلاب من السحابة، ولا تُعرض الأسماء بقائمة قديمة — تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.");
      $("#bar-t").textContent = MODE_T[A.mode] || "ورقة عمل";
      $("#bar-s").textContent = A.cname || "";
      if (!PV) remember();
      answers = A.qs.map(() => null);
      pickName();
    } catch (e) {
      clearTimeout(slow);
      fail("تعذّر فتح الورقة", "تحقق من اتصال الإنترنت ثم أعد المحاولة.");
    }
  }

  /* ﴿لبوابة الطالب s/﴾ وصفُ هذه الورقة — بلا سؤال ولا إجابة — يُحفظ في مخزن المتصفح على
     الأصل نفسه، فيراها الطفل في تبويب «مهامي» بحالتها ونتيجتها ولو لم يصل فهرس assignidx بعد.
     محلي بحت: لا يُرفع شيء، ولا يُقرأ إلا من هذا الجهاز، وأقصاه ستون ورقة. */
  function remember() {
    try {
      var K = "sijil.s.seen", raw = localStorage.getItem(K);
      var arr = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(arr)) arr = [];
      arr = arr.filter(function (x) { return x && x.a !== AID; });
      arr.unshift({
        a: AID, t: String(A.t || "ورقة").slice(0, 160), due: String(A.due || ""),
        tid: String(A.tid || ""), tn: String(A.tn || ""), subj: String(A.subj || ""),
        mode: String(A.mode || "ws"), n: (A.qs || []).length, cid: String(A.cid || ""),
        wk: +A.wk || 0, code: String(A.code || ""), tries: (A.tries == null ? null : +A.tries),
        ts: +A.ts || Date.now(), to: toList()
      });
      localStorage.setItem(K, JSON.stringify(arr.slice(0, 60)));
    } catch (e) { }
  }

  function isLate() { return !!(A.due && Date.now() > new Date(A.due).getTime()); }

  /* الورقة الموجَّهة (A.to): فهارس من أُرسلت إليهم وحدهم — واجب علاجي أو إثرائي. تُعرض أسماؤهم
     فقط، فلا يجد غيرهم اسمه ولا يُسلِّم ورقة ليست له. غياب to أو خلوّه = الفصل كله كما كان. */
  const toList = () => (Array.isArray(A.to) ? A.to.map(x => +x).filter(x => Number.isInteger(x) && x >= 0) : []);
  const toHas = (i) => { const t = toList(); return !t.length || t.indexOf(+i) >= 0; };
  function pickName() {
    const savedRaw = localStorage.getItem("sijil.stu." + A.cid);
    const saved = (savedRaw !== null && C.students[+savedRaw] && !C.students[+savedRaw].moved && toHas(+savedRaw)) ? savedRaw : null;   // اسم محفوظ لطالب منقول أو ليس من المقصودين يُهمل
    const list = (C.students || []).map((s, i) => ({ i, n: s.n, m: !!s.moved })).filter(x => !x.m && toHas(x.i));
    app.innerHTML = `<div class="card">
      <div class="note2" style="margin:0 0 6px">${A.mode === "ws" ? "📝 ورقة عمل تفاعلية" : A.mode === "quiz" ? "⏱️ اختبار قصير تفاعلي" : "🏁 سباق أسئلة"} — مادة ${esc(A.subj)}</div>
      <h1>${esc(A.t)}</h1>
      <p class="sub">المعلم: ${esc(A.tn)} · الفصل: ${esc(A.cname)} · ${A.qs.length} أسئلة${A.mode !== "ws" && A.secs ? ` · المدة ${Math.round(A.secs / 60)} دقيقة` : ""}</p>
      ${A.due ? `<p class="sub" style="margin-top:2px">⏰ آخر موعد للتسليم: ${esc(new Date(A.due).toLocaleString("ar-SA", { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" }))}</p>` : ""}
      ${isLate() ? `<div class="late">⏰ انتهى موعد التسليم، وسيُسجَّل حلّك متأخراً.</div>` : ""}
      <div class="note2" id="tries-note" style="margin:8px 0 4px">${PV ? "🧪 <b>وضع المعاينة</b> — تجربة للمعلم قبل الإرسال: لا تُسجَّل نتيجة ولا تُحتسب محاولة، ولا يرى الطلاب هذه الجلسة." : triesLabel(0)}</div>
      ${toList().length && !PV ? `<div class="note2" style="margin:8px 0 4px">🎯 ورقة خاصة: أرسلها معلمك إلى ${toList().length} من طلاب الفصل — إن لم تجد اسمك فهي ليست لك، وراجع معلمك.</div>` : ""}
      <p class="lbl">${PV ? "اختر اسماً للتجربة (اختياري)" : `اختر اسمك من فصل ${esc(A.cname)}`}</p>
      <div id="names">${list.map(s => `<button class="name${String(s.i) === saved ? " on" : ""}" data-i="${s.i}">${esc(s.n)}</button>`).join("")}</div>
      <button class="go" id="start" ${saved === null && !PV ? "disabled" : ""}>${PV ? "🧪 ابدأ المعاينة" : "ابدأ الحل"}</button></div>`;
    if (saved !== null) { si = +saved; sname = (C.students[si] || {}).n || ""; }
    app.querySelectorAll(".name").forEach(b => b.onclick = () => {
      app.querySelectorAll(".name").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); si = +b.dataset.i; sname = (C.students[si] || {}).n || "";
      localStorage.setItem("sijil.stu." + A.cid, String(si));
      $("#start").disabled = false;
    });
    $("#start").onclick = async () => {
      if (PV) { if (si < 0) { si = -1; sname = "معاينة المعلم"; } PREV = null; }
      else {
        let prev;
        try { prev = await withTimeout(db.doc("subs/" + AID + "_" + si).get()); }
        catch (e) { return fail("تعذّر بدء الحل", "تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة."); }
        if (prev.exists) {
          PREV = prev.data();
          if ((PREV.att || 1) >= allowed()) { return done(PREV, true); }
        }
      }
      t0 = Date.now(); qi = 0;
      if (A.mode !== "ws" && A.secs) { left = A.secs; startTimer(); }
      draw();
    };
  }

  function startTimer() {
    if (tIv) clearInterval(tIv);
    tIv = setInterval(() => {
      left--;
      const el = $("#tm");
      if (el) { el.textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0"); el.classList.toggle("hot", left <= 30); }
      if (left <= 0) { clearInterval(tIv); tIv = null; submit(); }
    }, 1000);
  }

  function draw() {
    const q = A.qs[qi];
    const pct = Math.round((qi) / A.qs.length * 100);
    const cur = answers[qi];
    let body = "";
    if (q.t === "fill") {
      body = `<input class="fill" id="fl" inputmode="text" autocomplete="off" placeholder="اكتب الإجابة" value="${esc(cur || "")}">
        <p class="hint">كلمة واحدة تكفي. التشكيل و«الـ» لا يؤثران.</p>`;
    } else {
      body = (q.opts || []).map((o, k) => o ? `<button class="opt${cur === k ? " on" : ""}" data-k="${k}">${q.t === "tf" ? "" : ["أ. ", "ب. ", "ج. ", "د. "][k]}${esc(o)}</button>` : "").join("");
    }
    app.innerHTML = `<div class="card">
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="qn"><span>السؤال ${qi + 1} من ${A.qs.length}</span>
        <span>${A.mode !== "ws" && A.secs ? `<span class="timer" id="tm">${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</span>` : esc(sname)}</span></div>
      <p class="q">${esc(q.q)}</p>
      ${body}
      <div class="nav">
        ${qi > 0 ? `<button class="back" id="prev">السابق</button>` : ""}
        <button class="go gold" id="next" style="margin-top:0">${qi === A.qs.length - 1 ? "إرسال الحل ✓" : "التالي ←"}</button>
      </div></div>`;
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      answers[qi] = +b.dataset.k;
      app.querySelectorAll(".opt").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
    });
    const fl = $("#fl"); if (fl) { fl.oninput = () => answers[qi] = fl.value; setTimeout(() => fl.focus(), 60); }
    const pv = $("#prev"); if (pv) pv.onclick = () => { qi--; draw(); };
    $("#next").onclick = () => {
      const q2 = A.qs[qi];
      if (answers[qi] === null || answers[qi] === "" || answers[qi] === undefined) {
        if (!confirm("لم تجب على هذا السؤال. هل تتخطاه؟")) return;
      }
      if (q2.t === "fill" && fl) answers[qi] = fl.value;
      if (qi < A.qs.length - 1) { qi++; draw(); } else submit();
    };
  }

  /* التصحيح: مصدر الإجابات وسيط لا متغيّر عام — فمراجعة تسليم سابق تُصحَّح من إجاباته
     المحفوظة (rec.ans) لا من مصفوفة هذه الجلسة الفارغة. */
  function grade(src) {
    const list = src || answers;
    let sc = 0; const detail = [];
    A.qs.forEach((q, i) => {
      const a = list[i];
      let ok = false, right = "";
      if (q.t === "fill") { right = q.ans || ""; ok = a != null && norm(a) === norm(right) && norm(right) !== ""; }
      else { right = (q.opts || [])[q.correct] || ""; ok = a === q.correct; }
      if (ok) sc++;
      detail.push({ i, ok, right, q: q.q });
    });
    return { sc, detail };
  }

  async function submit() {
    if (tIv) { clearInterval(tIv); tIv = null; }
    app.innerHTML = `<div class="err">جارِ الإرسال…</div>`;
    const { sc, detail } = grade();
    const now = Date.now(), secs = Math.round((now - t0) / 1000);
    let rec;
    if (PREV) {
      // المحاولة الأولى تبقى هي المسجَّلة؛ نضيف عدد المحاولات وأفضل نتيجة
      rec = {
        a: AID, si: si, n: PREV.n || sname, cid: A.cid, tid: A.tid,
        ans: PREV.ans || [], sc: PREV.sc, mx: A.qs.length,
        best: Math.max(PREV.best != null ? PREV.best : PREV.sc, sc),
        lsc: sc, att: Math.min(99, (PREV.att || 1) + 1),
        secs: PREV.secs || secs, late: !!PREV.late, ts: PREV.ts || now, lts: now
      };
    } else {
      rec = {
        a: AID, si: si, n: sname, cid: A.cid, tid: A.tid,
        ans: answers.map(x => x === null || x === undefined ? "" : x),
        sc: sc, mx: A.qs.length, best: sc, lsc: sc, att: 1,
        secs: secs, late: isLate(), ts: now, lts: now
      };
    }
    if (!PV && (rec.att || 1) <= 12) {
      // فشل الكتابة كان يُبتلع فيرى الطالب «أُرسلت إلى معلمك ✓» وحلّه لم يصل إلى أحد
      try { await withTimeout(db.doc("subs/" + AID + "_" + si).set(rec)); }
      catch (e) { return sendFail(); }
    }
    PREV = PV ? null : rec;
    if (!PV) markMine(si);
    done(rec, false, detail, sc);
  }

  function sendFail() {
    app.innerHTML = `<div class="card mid">
      <div class="big">📡</div>
      <p style="font-weight:800;font-size:20px;color:var(--navy);margin:0">لم تصل إجاباتك إلى معلمك</p>
      <p class="sub" style="margin:6px 0 0">إجاباتك ما زالت محفوظة في هذه الصفحة. تحقق من اتصال الإنترنت ثم اضغط «إعادة الإرسال»، ولا تغلق الصفحة قبل ذلك.</p>
      <button class="go gold" id="resend" style="margin-top:16px">↻ إعادة الإرسال</button>
      <button class="go" id="reback" style="margin-top:9px">← العودة إلى الأسئلة</button>
    </div>`;
    $("#resend").onclick = () => { app.innerHTML = `<div class="err">جارِ الإرسال…</div>`; submit(); };
    $("#reback").onclick = () => { qi = A.qs.length - 1; draw(); };
  }

  function done(rec, again, detail, thisSc) {
    /* مراجعة تسليم سابق: تُصحَّح من rec.ans المحفوظة. كانت تُصحَّح من answers الفارغة فتُعلَّم
       كل الأسئلة خطأً وتُطبع الإجابة الصحيحة لكلٍّ منها — مفتاح إجابة كامل لطالب حصل 4 من 4. */
    const saved = Array.isArray(rec && rec.ans) ? rec.ans : null;
    if (!detail) detail = grade(saved || undefined).detail;
    const cur = thisSc == null ? rec.sc : thisSc;      // درجة هذه المحاولة
    const att = rec.att || 1, repeat = att > 1;
    const pct = Math.round(cur / rec.mx * 100);
    /* المراجعة (وفيها الإجابات الصحيحة) لهذه الجلسة، أو لتسليم أرسله هذا الجهاز نفسه ونعرف
       إجاباته. غير ذلك — اسم اختير من القائمة فقط — نعرض النتيجة بلا مفتاح. */
    const owned = PV || !again || (isMine(rec.si != null ? rec.si : si) && !!saved);
    const wrong = owned ? detail.filter(d => !d.ok) : [];
    const face = pct >= 90 ? "🏆" : pct >= 70 ? "🌟" : pct >= 50 ? "👍" : "💪";
    const word = pct >= 90 ? "ممتاز" : pct >= 70 ? "أحسنت" : pct >= 50 ? "جيد" : "حاول مرة أخرى";
    const showAns = owned;
    app.innerHTML = `<div class="card mid">
      <div class="big">${face}</div>
      <div class="ring" style="background:conic-gradient(${pct >= 50 ? "var(--ok)" : "var(--gold)"} 0 ${pct}%, #E8E2D5 ${pct}%)"><b>${cur} <i>من ${rec.mx}</i></b></div>
      <p style="font-weight:800;font-size:20px;color:var(--navy);margin:0">${word} يا ${esc((sname || rec.n || "").split(" ")[0])}</p>
      <p class="sub" style="margin:4px 0 0">${PV ? "🧪 معاينة — لم تُسجَّل هذه النتيجة ولم تصل إلى أحد" : `${again ? "سبق أن أرسلت هذه الورقة" : "أُرسلت إلى معلمك ✓"}${rec.late ? " · تسليم متأخر" : ""}`}</p>
      ${again ? `<div class="note2">${att >= allowed() ? `استُنفدت المحاولات المسموحة (${allowed()})` : triesLabel(att)}</div>` : ""}
      ${repeat ? `<div class="note2">هذه محاولتك رقم ${att} من ${allowed()} · درجتك المسجّلة عند المعلم <b>${rec.sc} من ${rec.mx}</b> من المحاولة الأولى${rec.best > rec.sc ? ` · أفضل نتيجة لك ${rec.best}` : ""}<br><span style="color:var(--muted)">${att < allowed() ? "أعد المحاولة كما تشاء، فكل مرة تزيد فهمك 💪" : ""}</span></div>` : ""}
      ${showAns && wrong.length ? `<div style="text-align:right;margin-top:16px">
        <p class="lbl">راجع هذه فقط:</p>
        ${wrong.map(d => `<div class="rev"><span class="x">✗</span> ${esc(d.q)}<div class="a">الصحيح: ${esc(d.right)}</div></div>`).join("")}
      </div>` : ""}
      ${showAns && !wrong.length ? `<p style="color:var(--ok);font-weight:800;margin-top:14px">كل إجاباتك صحيحة! 🎉</p>` : ""}
      ${!owned ? `<div class="note2">هذه نتيجة مسجَّلة من جهاز آخر — لمراجعة الأخطاء افتح الورقة من الجهاز الذي حللت عليه، أو راجعها مع معلمك.</div>` : ""}
      ${!again && (PV || att < allowed()) ? `<button class="go" id="retry" style="margin-top:18px">↺ ${PV ? "أعد المعاينة" : `${allowed() - att === 1 ? "محاولة أخيرة" : "تدرّب مرة أخرى"} <small style="font-weight:500">(بقي ${allowed() - att} من ${allowed()})</small>`}</button>` : ""}
      ${!PV && att >= allowed() && allowed() > 1 ? `<p class="hint" style="margin-top:14px">وصلت إلى أقصى عدد للمحاولات (${allowed()}). راجع الدرس مع معلمك 🌱</p>` : ""}
    </div>`;
    const rt = $("#retry"); if (rt) rt.onclick = () => { answers = A.qs.map(() => null); qi = 0; t0 = Date.now(); if (A.mode !== "ws" && A.secs) { left = A.secs; startTimer(); } draw(); };
  }

  boot();
})();
</script>
</body>
</html>
